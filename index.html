(avg, 2).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n90\n80\n70\n85\n", "output": "81.25\n", "sample": true}, {"input": "3\n1\n2\n2\n", "output": "1.67\n", "sample": false}, {"input": "1\n100\n", "output": "100\n", "sample": false}, {"input": "3\n10\n20\n31\n", "output": "20.33\n", "sample": false}], "hints": ["ממוצע = סכום חלקי כמות. קודם צריך לחשב סכום, כמו בתרגיל הקודם.", "int חלקי int ב-C# זורק את השארית (7/2=3). לכן צריך להפוך אחד מהם ל-double.", "double avg = (double)sum / n; ואז Console.WriteLine(Math.Round(avg, 2));"], "explanation": "סוכמים את כל המספרים בלולאה. אחר כך מחלקים את הסכום ב-N אחרי המרה ל-double כדי לא לאבד את החלק העשרוני, ומעגלים ל-2 ספרות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        for (int i = 0; i < n; i++)\n        {\n            sum += int.Parse(Console.ReadLine());\n        }\n        double avg = (double)sum / n;\n        Console.WriteLine(Math.Round(avg, 2));\n    }\n}\n"}, {"id": "for-07", "level": "בינוני", "title": "עצרת", "statement": "קלוט מספר שלם N בין 0 ל-15 והדפס את N! (עצרת: 1*2*3*...*N). שימו לב: 0! = 1. השתמשו במשתנה מטיפוס long.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n", "output": "120\n", "sample": true}, {"input": "0\n", "output": "1\n", "sample": false}, {"input": "10\n", "output": "3628800\n", "sample": false}, {"input": "15\n", "output": "1307674368000\n", "sample": false}], "hints": ["עצרת היא מכפלה, וזה כמו סכום – רק עם כפל.", "מכפלה מתחילה ב-1 ולא ב-0, כי כל מספר כפול 0 הוא 0.", "long f = 1; ובלולאה f *= i; – long כי 15! גדול מדי ל-int."], "explanation": "משתנה f מטיפוס long מתחיל ב-1. הלולאה כופלת אותו בכל מספר מ-1 עד N. עבור N=0 הלולאה לא רצה בכלל, ולכן מודפס 1 כמו שצריך.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        long f = 1;\n        for (int i = 1; i <= n; i++)\n        {\n            f *= i;\n        }\n        Console.WriteLine(f);\n    }\n}\n"}, {"id": "for-08", "level": "בינוני", "title": "המספר הגדול ביותר", "statement": "קלוט מספר שלם N (גדול מ-0), ואחריו N מספרים שלמים. הדפס את הגדול ביותר.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n3\n9\n2\n7\n", "output": "9\n", "sample": true}, {"input": "3\n-5\n-2\n-9\n", "output": "-2\n", "sample": false}, {"input": "1\n42\n", "output": "42\n", "sample": false}], "hints": ["צריך משתנה שזוכר 'את הגדול ביותר עד עכשיו'.", "אל תתחילו את max ב-0 – אם כל המספרים שליליים זה ייתן תשובה שגויה. קחו את המספר הראשון.", "קלטו את הראשון לתוך max, ואז לולאה על N-1 הנותרים עם if (x > max) max = x;"], "explanation": "המספר הראשון נשמר כמקסימום ההתחלתי. הלולאה עוברת על שאר המספרים, ואם מספר גדול מהמקסימום הוא הופך למקסימום החדש.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int max = int.Parse(Console.ReadLine());\n        for (int i = 1; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (x > max)\n            {\n                max = x;\n            }\n        }\n        Console.WriteLine(max);\n    }\n}\n"}, {"id": "for-09", "level": "מבחן", "title": "עוברים במבחן", "statement": "קלוט מספר תלמידים N (גדול מ-0), ואחריו N ציונים. ציון 55 ומעלה הוא עובר. הדפס שתי שורות:\nPassed: <מספר העוברים>\nPercent: <אחוז העוברים מעוגל ל-2 ספרות בעזרת Math.Round>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n90\n40\n55\n70\n30\n", "output": "Passed: 3\nPercent: 60\n", "sample": true}, {"input": "3\n100\n99\n98\n", "output": "Passed: 3\nPercent: 100\n", "sample": false}, {"input": "3\n10\n60\n20\n", "output": "Passed: 1\nPercent: 33.33\n", "sample": false}], "hints": ["יש כאן שני חלקים: ספירה (בתוך הלולאה) ואחוז (אחרי הלולאה).", "מונה passed גדל רק כשהתנאי grade >= 55 מתקיים.", "אחוז = passed * 100.0 / n – ה-100.0 הופך את החישוב לעשרוני, ואז Math.Round(..., 2)."], "explanation": "בלולאה קולטים כל ציון וסופרים את העוברים. אחרי הלולאה מחשבים אחוז עם 100.0 כדי לקבל תוצאה עשרונית, ומדפיסים בפורמט המבוקש.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int passed = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int grade = int.Parse(Console.ReadLine());\n            if (grade >= 55)\n            {\n                passed++;\n            }\n        }\n        Console.WriteLine(\"Passed: \" + passed);\n        Console.WriteLine(\"Percent: \" + Math.Round(passed * 100.0 / n, 2));\n    }\n}\n"}, {"id": "for-10", "level": "מבחן", "title": "ספרת אחדות 7", "statement": "קלוט N ואחריו N מספרים שלמים חיוביים. הדפס שתי שורות:\nEnds with 7: <כמה מספרים שספרת האחדות שלהם 7>\nDivisible by 3: <כמה מספרים מתחלקים ב-3>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n17\n27\n5\n9\n", "output": "Ends with 7: 2\nDivisible by 3: 2\n", "sample": true}, {"input": "3\n1\n2\n4\n", "output": "Ends with 7: 0\nDivisible by 3: 0\n", "sample": false}, {"input": "5\n7\n3\n77\n21\n100\n", "output": "Ends with 7: 2\nDivisible by 3: 2\n", "sample": false}], "hints": ["צריך שני מונים נפרדים, כי מספר יכול להיות גם וגם (למשל 27).", "ספרת האחדות היא השארית מחלוקה ב-10: x % 10.", "שני if נפרדים (לא else if!), כדי שמספר שמתאים לשני התנאים ייספר בשניהם."], "explanation": "לכל מספר בודקים בנפרד אם x % 10 == 7 ואם x % 3 == 0, ומגדילים את המונה המתאים. משתמשים בשני if נפרדים כי התנאים לא סותרים זה את זה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sevens = 0;\n        int div3 = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (x % 10 == 7)\n            {\n                sevens++;\n            }\n            if (x % 3 == 0)\n            {\n                div3++;\n            }\n        }\n        Console.WriteLine(\"Ends with 7: \" + sevens);\n        Console.WriteLine(\"Divisible by 3: \" + div3);\n    }\n}\n"}, {"id": "for-11", "level": "מבחן", "title": "משולש כוכביות", "statement": "קלוט N והדפס משולש של כוכביות: בשורה הראשונה כוכבית אחת, בשנייה שתיים, וכך עד N כוכביות בשורה האחרונה.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n", "output": "*\n**\n***\n", "sample": true}, {"input": "1\n", "output": "*\n", "sample": false}, {"input": "5\n", "output": "*\n**\n***\n****\n*****\n", "sample": false}], "hints": ["כל שורה היא בעצמה 'לולאה קטנה' של כוכביות – אז צריך לולאה בתוך לולאה.", "הלולאה החיצונית היא מספר השורה i, והפנימית מדפיסה i כוכביות.", "בפנימית Console.Write(\"*\"), ואחריה Console.WriteLine() כדי לרדת שורה."], "explanation": "הלולאה החיצונית רצה על השורות 1 עד N. הלולאה הפנימית מדפיסה בכל שורה i כוכביות בלי לרדת שורה, ובסוף כל שורה עוברים לשורה חדשה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        for (int i = 1; i <= n; i++)\n        {\n            for (int j = 1; j <= i; j++)\n            {\n                Console.Write(\"*\");\n            }\n            Console.WriteLine();\n        }\n    }\n}\n"}]}, {"id": "while-loops", "title": "לולאת while", "order": 5, "intro": "לולאת while חוזרת על קוד כל עוד תנאי מתקיים. משתמשים בה כשלא יודעים מראש כמה פעמים נחזור – למשל עד שהמשתמש מקליד 0, או עד שנגמרות הספרות של מספר.\n\nדוגמה – ספירת ספרות:\nint n = 4521;\nint count = 0;\nwhile (n > 0)\n{\n    n = n / 10;\n    count++;\n}\n// count = 4", "exercises": [{"id": "while-01", "level": "קל", "title": "כמה ספרות", "statement": "קלוט מספר שלם חיובי והדפס כמה ספרות יש בו.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4521\n", "output": "4\n", "sample": true}, {"input": "7\n", "output": "1\n", "sample": false}, {"input": "100000\n", "output": "6\n", "sample": false}], "hints": ["לא יודעים מראש כמה ספרות יש – לכן while ולא for.", "חלוקה ב-10 'מוחקת' את הספרה הימנית: 452 / 10 = 45.", "while (n > 0) { n = n / 10; count++; }"], "explanation": "בכל סיבוב מורידים ספרה אחת על ידי חלוקה ב-10 וסופרים. כשהמספר מגיע ל-0 לא נשארו ספרות, והמונה הוא מספר הספרות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int count = 0;\n        while (n > 0)\n        {\n            n = n / 10;\n            count++;\n        }\n        Console.WriteLine(count);\n    }\n}\n"}, {"id": "while-02", "level": "קל", "title": "סכום ספרות", "statement": "קלוט מספר שלם חיובי והדפס את סכום הספרות שלו.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4521\n", "output": "12\n", "sample": true}, {"input": "9\n", "output": "9\n", "sample": false}, {"input": "1001\n", "output": "2\n", "sample": false}, {"input": "99999\n", "output": "45\n", "sample": false}], "hints": ["זה כמו ספירת ספרות, אבל במקום לספור – מחברים.", "n % 10 נותן את הספרה הימנית, ו-n / 10 מוחק אותה.", "sum += n % 10; n = n / 10; – הסדר חשוב: קודם לוקחים את הספרה ורק אז מוחקים."], "explanation": "הלולאה לוקחת בכל פעם את ספרת האחדות עם % 10, מוסיפה אותה לסכום, ומוחקת אותה עם / 10. כשהמספר מגיע ל-0, הסכום מוכן.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        while (n > 0)\n        {\n            sum += n % 10;\n            n = n / 10;\n        }\n        Console.WriteLine(sum);\n    }\n}\n"}, {"id": "while-03", "level": "קל", "title": "עד שמגיע 0", "statement": "קלוט מספרים שלמים אחד אחרי השני עד שנקלט 0. הדפס את סכום המספרים (ה-0 לא נספר).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n3\n2\n0\n", "output": "10\n", "sample": true}, {"input": "0\n", "output": "0\n", "sample": false}, {"input": "-4\n10\n0\n", "output": "6\n", "sample": false}], "hints": ["0 הוא 'סימן עצירה' – לא יודעים מתי יגיע, ולכן while.", "צריך לקלוט מספר לפני הלולאה, כדי שיהיה מה לבדוק בתנאי.", "while (x != 0) { sum += x; x = int.Parse(Console.ReadLine()); } – הקליטה בסוף הסיבוב."], "explanation": "קולטים מספר ראשון, ונכנסים ללולאה כל עוד הוא לא 0. בכל סיבוב מוסיפים אותו לסכום וקולטים את הבא, כך שה-0 לעולם לא נוסף.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int x = int.Parse(Console.ReadLine());\n        int sum = 0;\n        while (x != 0)\n        {\n            sum += x;\n            x = int.Parse(Console.ReadLine());\n        }\n        Console.WriteLine(sum);\n    }\n}\n"}, {"id": "while-04", "level": "בינוני", "title": "מספר הפוך", "statement": "קלוט מספר שלם חיובי והדפס אותו הפוך (למשל 1234 יהפוך ל-4321, ו-120 יהפוך ל-21).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "1234\n", "output": "4321\n", "sample": true}, {"input": "120\n", "output": "21\n", "sample": false}, {"input": "5\n", "output": "5\n", "sample": false}, {"input": "9081\n", "output": "1809\n", "sample": false}], "hints": ["לוקחים ספרות מימין (עם % 10) ובונים מהן מספר חדש.", "כדי 'להוסיף ספרה מימין' למספר מכפילים אותו ב-10 ומוסיפים את הספרה: 43 → 432.", "rev = rev * 10 + n % 10; n = n / 10;"], "explanation": "בכל סיבוב לוקחים את ספרת האחדות של n ומצמידים אותה מימין ל-rev באמצעות rev * 10 + ספרה. כך הספרות נכנסות בסדר הפוך. אפסים בהתחלה נעלמים כי זה מספר.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int rev = 0;\n        while (n > 0)\n        {\n            rev = rev * 10 + n % 10;\n            n = n / 10;\n        }\n        Console.WriteLine(rev);\n    }\n}\n"}, {"id": "while-05", "level": "בינוני", "title": "ממוצע עד -1", "statement": "קלוט ציונים עד שנקלט -1. הדפס שתי שורות:\nCount: <מספר הציונים>\nAverage: <ממוצע מעוגל ל-2 ספרות בעזרת Math.Round>\nאם לא נקלט אף ציון, הדפס רק: No grades", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "90\n80\n-1\n", "output": "Count: 2\nAverage: 85\n", "sample": true}, {"input": "-1\n", "output": "No grades\n", "sample": false}, {"input": "70\n71\n71\n-1\n", "output": "Count: 3\nAverage: 70.67\n", "sample": false}], "hints": ["כמו בתרגיל ה-0, רק שסימן העצירה הוא -1.", "לממוצע צריך גם סכום וגם מונה.", "אחרי הלולאה: if (count == 0) – אסור לחלק באפס! אחרת Math.Round((double)sum / count, 2)."], "explanation": "קולטים עד -1 וסוכמים וסופרים. אחרי הלולאה בודקים אם נקלט משהו; אם כן מחשבים ממוצע עשרוני ומעגלים, ואם לא מדפיסים No grades.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int x = int.Parse(Console.ReadLine());\n        int count = 0;\n        int sum = 0;\n        while (x != -1)\n        {\n            sum += x;\n            count++;\n            x = int.Parse(Console.ReadLine());\n        }\n        if (count == 0)\n        {\n            Console.WriteLine(\"No grades\");\n        }\n        else\n        {\n            Console.WriteLine(\"Count: \" + count);\n            Console.WriteLine(\"Average: \" + Math.Round((double)sum / count, 2));\n        }\n    }\n}\n"}, {"id": "while-06", "level": "בינוני", "title": "נחש את המספר", "statement": "המספר הסודי הוא 7. קלוט ניחושים עד שנקלט 7. אחרי כל ניחוש שגוי הדפס Too low אם הוא קטן מ-7 או Too high אם הוא גדול. כשמנחשים נכון הדפס: Correct after <מספר הניסיונות> tries", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n9\n7\n", "output": "Too low\nToo high\nCorrect after 3 tries\n", "sample": true}, {"input": "7\n", "output": "Correct after 1 tries\n", "sample": false}, {"input": "1\n2\n10\n7\n", "output": "Too low\nToo low\nToo high\nCorrect after 4 tries\n", "sample": false}], "hints": ["חוזרים כל עוד הניחוש לא נכון – זה בדיוק התנאי של while.", "הניחוש הראשון נקלט לפני הלולאה, אז המונה מתחיל ב-1.", "בתוך הלולאה: מדפיסים Too low או Too high, קולטים ניחוש חדש ו-tries++."], "explanation": "הניחוש הראשון נקלט מחוץ ללולאה ונספר. כל עוד הוא לא 7, מדפיסים רמז, קולטים ניחוש חדש ומגדילים את המונה. אחרי הלולאה מדפיסים את מספר הניסיונות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int guess = int.Parse(Console.ReadLine());\n        int tries = 1;\n        while (guess != 7)\n        {\n            if (guess < 7)\n            {\n                Console.WriteLine(\"Too low\");\n            }\n            else\n            {\n                Console.WriteLine(\"Too high\");\n            }\n            guess = int.Parse(Console.ReadLine());\n            tries++;\n        }\n        Console.WriteLine(\"Correct after \" + tries + \" tries\");\n    }\n}\n"}, {"id": "while-07", "level": "בינוני", "title": "חזקה של 2", "statement": "קלוט מספר שלם חיובי N והדפס את החזקה הקטנה ביותר של 2 שגדולה או שווה ל-N (למשל עבור 20 – 32).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "20\n", "output": "32\n", "sample": true}, {"input": "1\n", "output": "1\n", "sample": false}, {"input": "64\n", "output": "64\n", "sample": false}, {"input": "65\n", "output": "128\n", "sample": false}], "hints": ["החזקות של 2 הן 1, 2, 4, 8, 16... כל אחת כפולה מהקודמת.", "מתחילים מ-1 ומכפילים עד שמגיעים ל-N או עוברים אותו.", "while (p < n) p *= 2; – אם N כבר חזקה של 2, הלולאה עוצרת בדיוק עליו."], "explanation": "p מתחיל ב-1 ומוכפל ב-2 כל עוד הוא קטן מ-N. ברגע שהוא גדול או שווה ל-N הלולאה נעצרת, ו-p היא החזקה המבוקשת.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int p = 1;\n        while (p < n)\n        {\n            p *= 2;\n        }\n        Console.WriteLine(p);\n    }\n}\n"}, {"id": "while-08", "level": "מבחן", "title": "סיסמה", "statement": "הסיסמה הנכונה היא 1234. קלוט סיסמאות (מספרים) עד שהסיסמה נכונה או עד שנעשו 3 ניסיונות. אם הסיסמה נכונה הדפס Access granted, אחרת (אחרי 3 טעויות) הדפס Blocked.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "1111\n1234\n", "output": "Access granted\n", "sample": true}, {"input": "1\n2\n3\n", "output": "Blocked\n", "sample": false}, {"input": "1234\n", "output": "Access granted\n", "sample": false}, {"input": "5\n6\n1234\n", "output": "Access granted\n", "sample": false}], "hints": ["יש שתי סיבות לעצור: סיסמה נכונה או שנגמרו הניסיונות. לכן התנאי משלב שני חלקים.", "ממשיכים רק אם הסיסמה שגויה וגם נשארו ניסיונות: &&.", "אחרי הלולאה בודקים if (pass == 1234) – כך יודעים למה יצאנו."], "explanation": "קולטים ניסיון ראשון. הלולאה ממשיכה רק כשהסיסמה שגויה ועוד לא נעשו 3 ניסיונות. אחרי היציאה בודקים אם הסיסמה האחרונה נכונה, ולפי זה מדפיסים.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int pass = int.Parse(Console.ReadLine());\n        int tries = 1;\n        while (pass != 1234 && tries < 3)\n        {\n            pass = int.Parse(Console.ReadLine());\n            tries++;\n        }\n        if (pass == 1234)\n        {\n            Console.WriteLine(\"Access granted\");\n        }\n        else\n        {\n            Console.WriteLine(\"Blocked\");\n        }\n    }\n}\n"}, {"id": "while-09", "level": "מבחן", "title": "חיסכון", "statement": "קלוט שלושה מספרים שלמים: סכום התחלתי, הפקדה חודשית ויעד. הדפס כמה חודשים צריך לחסוך כדי להגיע ליעד או לעבור אותו. אם הסכום ההתחלתי כבר מגיע ליעד, הדפס 0.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "100\n50\n300\n", "output": "4\n", "sample": true}, {"input": "500\n10\n200\n", "output": "0\n", "sample": false}, {"input": "0\n30\n100\n", "output": "4\n", "sample": false}], "hints": ["לא ידוע כמה חודשים – זה מה שמחפשים, ולכן while.", "כל חודש קורים שני דברים: הכסף גדל, והמונה גדל.", "while (money < goal) { money += deposit; months++; } – אם כבר הגענו ליעד, הלולאה לא רצה ונקבל 0."], "explanation": "מתחילים עם הסכום ההתחלתי ו-0 חודשים. כל עוד לא הגענו ליעד מוסיפים הפקדה וסופרים חודש. התנאי בודק לפני כל סיבוב, לכן מקרה שכבר עבר את היעד נותן 0.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int money = int.Parse(Console.ReadLine());\n        int deposit = int.Parse(Console.ReadLine());\n        int goal = int.Parse(Console.ReadLine());\n        int months = 0;\n        while (money < goal)\n        {\n            money += deposit;\n            months++;\n        }\n        Console.WriteLine(months);\n    }\n}\n"}, {"id": "while-10", "level": "מבחן", "title": "מקסימום ומינימום", "statement": "קלוט מספרים שלמים עד שנקלט 0 (יש לפחות מספר אחד לפני ה-0). הדפס שתי שורות:\nMax: <הגדול>\nMin: <הקטן>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n-2\n9\n0\n", "output": "Max: 9\nMin: -2\n", "sample": true}, {"input": "4\n0\n", "output": "Max: 4\nMin: 4\n", "sample": false}, {"input": "-1\n-8\n-3\n0\n", "output": "Max: -1\nMin: -8\n", "sample": false}], "hints": ["צריך שני משתנים: אחד לגדול ואחד לקטן.", "התחילו את שניהם מהמספר הראשון – כך אין בעיה עם מספרים שליליים.", "בלולאה: if (x > max) max = x; if (x < min) min = x; ואז קולטים את הבא."], "explanation": "המספר הראשון הוא גם מקסימום וגם מינימום התחלתי. כל עוד לא נקלט 0, משווים כל מספר לשניהם ומעדכנים, ואז קולטים את הבא.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int x = int.Parse(Console.ReadLine());\n        int max = x;\n        int min = x;\n        while (x != 0)\n        {\n            if (x > max) max = x;\n            if (x < min) min = x;\n            x = int.Parse(Console.ReadLine());\n        }\n        Console.WriteLine(\"Max: \" + max);\n        Console.WriteLine(\"Min: \" + min);\n    }\n}\n"}, {"id": "while-11", "level": "מבחן", "title": "פלינדרום", "statement": "קלוט מספר שלם חיובי. אם הוא נקרא אותו דבר משני הכיוונים (למשל 12321) הדפס Palindrome, אחרת הדפס Not palindrome.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "12321\n", "output": "Palindrome\n", "sample": true}, {"input": "1234\n", "output": "Not palindrome\n", "sample": false}, {"input": "7\n", "output": "Palindrome\n", "sample": false}, {"input": "1221\n", "output": "Palindrome\n", "sample": false}], "hints": ["פלינדרום = המספר שווה להיפוך שלו. כבר יודעים להפוך מספר!", "הלולאה 'הורסת' את n (הוא מגיע ל-0), אז שמרו עותק לפני.", "int original = n; ... if (rev == original)."], "explanation": "שומרים עותק של המספר, ואז הופכים אותו בלולאה כמו בתרגיל המספר ההפוך. אם ההיפוך שווה למקור – זה פלינדרום.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int original = n;\n        int rev = 0;\n        while (n > 0)\n        {\n            rev = rev * 10 + n % 10;\n            n /= 10;\n        }\n        if (rev == original)\n        {\n            Console.WriteLine(\"Palindrome\");\n        }\n        else\n        {\n            Console.WriteLine(\"Not palindrome\");\n        }\n    }\n}\n"}]}, {"id": "loops-and-conditions", "title": "שילוב לולאות ותנאים", "order": 6, "intro": "ברוב שאלות המבחן יש לולאה שקולטת הרבה נתונים, ובתוכה תנאים שמחליטים מה לעשות עם כל נתון: לספור, לסכום או למצוא את הגדול.\n\nדוגמה – ספירת מספרים חיוביים:\nint count = 0;\nfor (int i = 0; i < n; i++)\n{\n    int x = int.Parse(Console.ReadLine());\n    if (x > 0)\n    {\n        count++;\n    }\n}", "exercises": [{"id": "lc-01", "level": "קל", "title": "חיובי, שלילי, אפס", "statement": "קלוט N ואחריו N מספרים שלמים. הדפס שלוש שורות:\nPositive: <כמות>\nNegative: <כמות>\nZero: <כמות>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n3\n-1\n0\n7\n-2\n", "output": "Positive: 2\nNegative: 2\nZero: 1\n", "sample": true}, {"input": "2\n0\n0\n", "output": "Positive: 0\nNegative: 0\nZero: 2\n", "sample": false}, {"input": "3\n1\n2\n3\n", "output": "Positive: 3\nNegative: 0\nZero: 0\n", "sample": false}], "hints": ["כל מספר שייך לקבוצה אחת בדיוק – חיובי, שלילי או אפס.", "בגלל שזה 'אחד משלושה', מתאים if / else if / else.", "if (x > 0) pos++; else if (x < 0) neg++; else zero++;"], "explanation": "קולטים N מספרים בלולאה. לכל מספר שרשרת if / else if / else מחליטה לאיזה מונה הוא שייך. בסוף מדפיסים את שלושת המונים.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int pos = 0, neg = 0, zero = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (x > 0) pos++;\n            else if (x < 0) neg++;\n            else zero++;\n        }\n        Console.WriteLine(\"Positive: \" + pos);\n        Console.WriteLine(\"Negative: \" + neg);\n        Console.WriteLine(\"Zero: \" + zero);\n    }\n}\n"}, {"id": "lc-02", "level": "קל", "title": "זוגי ואי-זוגי", "statement": "קלוט N ואחריו N מספרים שלמים חיוביים. הדפס:\nEven: <כמות הזוגיים>\nOdd: <כמות האי-זוגיים>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n1\n2\n3\n4\n", "output": "Even: 2\nOdd: 2\n", "sample": true}, {"input": "3\n5\n7\n9\n", "output": "Even: 0\nOdd: 3\n", "sample": false}, {"input": "1\n10\n", "output": "Even: 1\nOdd: 0\n", "sample": false}], "hints": ["מספר הוא זוגי או אי-זוגי – אין אפשרות שלישית, אז מספיק if / else.", "זוגי פירושו שאין שארית בחלוקה ב-2.", "if (x % 2 == 0) even++; else odd++;"], "explanation": "לכל מספר בודקים את השארית בחלוקה ב-2. שארית 0 – זוגי, אחרת אי-זוגי. בסוף מדפיסים את שני המונים.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int even = 0, odd = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (x % 2 == 0) even++;\n            else odd++;\n        }\n        Console.WriteLine(\"Even: \" + even);\n        Console.WriteLine(\"Odd: \" + odd);\n    }\n}\n"}, {"id": "lc-03", "level": "בינוני", "title": "ימים חמים", "statement": "קלוט N ימים ואחריו טמפרטורה (מספר שלם) לכל יום. הדפס:\nHot days: <כמה ימים מעל 30>\nHottest: <הטמפרטורה הגבוהה ביותר>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n28\n31\n35\n30\n22\n", "output": "Hot days: 2\nHottest: 35\n", "sample": true}, {"input": "3\n10\n12\n11\n", "output": "Hot days: 0\nHottest: 12\n", "sample": false}, {"input": "1\n40\n", "output": "Hot days: 1\nHottest: 40\n", "sample": false}], "hints": ["יש כאן שתי משימות באותה לולאה: לספור ולמצוא מקסימום.", "'מעל 30' פירושו גדול ממש: t > 30. יום של 30 בדיוק לא נחשב.", "אפשר להתחיל את hottest ב-int.MinValue (המספר הכי קטן) כדי שהטמפרטורה הראשונה תמיד תחליף אותו."], "explanation": "באותה לולאה בודקים לכל טמפרטורה אם היא מעל 30 וסופרים, ובנפרד משווים אותה למקסימום. int.MinValue מבטיח שהערך הראשון יתפוס את המקום.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int hot = 0;\n        int hottest = int.MinValue;\n        for (int i = 0; i < n; i++)\n        {\n            int t = int.Parse(Console.ReadLine());\n            if (t > 30) hot++;\n            if (t > hottest) hottest = t;\n        }\n        Console.WriteLine(\"Hot days: \" + hot);\n        Console.WriteLine(\"Hottest: \" + hottest);\n    }\n}\n"}, {"id": "lc-04", "level": "בינוני", "title": "FizzBuzz", "statement": "קלוט N והדפס את המספרים מ-1 עד N, כל אחד בשורה, אבל: במקום מספר שמתחלק ב-3 וב-5 הדפס FizzBuzz, במקום מספר שמתחלק רק ב-3 הדפס Fizz, ובמקום מספר שמתחלק רק ב-5 הדפס Buzz.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n", "output": "1\n2\nFizz\n4\nBuzz\n", "sample": true}, {"input": "15\n", "output": "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n", "sample": false}, {"input": "2\n", "output": "1\n2\n", "sample": false}], "hints": ["לכל מספר יש 4 אפשרויות, אז שרשרת else if.", "אם תבדקו קודם 'מתחלק ב-3', המספר 15 יקבל Fizz ולא FizzBuzz – לכן המקרה הכפול ראשון.", "if (i % 3 == 0 && i % 5 == 0) ... else if (i % 3 == 0) ... else if (i % 5 == 0) ... else Console.WriteLine(i);"], "explanation": "עוברים על 1 עד N. לכל מספר בודקים קודם את המקרה המחמיר (3 וגם 5), אחר כך כל אחד לבד, ואם אף אחד לא מתקיים מדפיסים את המספר.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        for (int i = 1; i <= n; i++)\n        {\n            if (i % 3 == 0 && i % 5 == 0) Console.WriteLine(\"FizzBuzz\");\n            else if (i % 3 == 0) Console.WriteLine(\"Fizz\");\n            else if (i % 5 == 0) Console.WriteLine(\"Buzz\");\n            else Console.WriteLine(i);\n        }\n    }\n}\n"}, {"id": "lc-05", "level": "בינוני", "title": "מספרים דו-ספרתיים", "statement": "קלוט N ואחריו N מספרים שלמים חיוביים. הדפס את סכום המספרים הדו-ספרתיים בלבד (בין 10 ל-99).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n5\n10\n99\n100\n", "output": "109\n", "sample": true}, {"input": "3\n1\n2\n3\n", "output": "0\n", "sample": false}, {"input": "3\n50\n50\n7\n", "output": "100\n", "sample": false}], "hints": ["רק חלק מהמספרים נכנסים לסכום – צריך תנאי לפני ההוספה.", "דו-ספרתי פירושו שני גבולות: לפחות 10 וגם לכל היותר 99.", "if (x >= 10 && x <= 99) sum += x;"], "explanation": "קולטים כל מספר ובודקים עם && שהוא בטווח 10–99. רק מספרים שעוברים את הבדיקה מתווספים לסכום.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (x >= 10 && x <= 99) sum += x;\n        }\n        Console.WriteLine(sum);\n    }\n}\n"}, {"id": "lc-06", "level": "בינוני", "title": "מספר ראשוני", "statement": "קלוט מספר שלם N גדול מ-1. אם הוא ראשוני (מתחלק רק ב-1 ובעצמו) הדפס Prime, אחרת הדפס Not prime. כתבו פונקציה static bool IsPrime(int n).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "7\n", "output": "Prime\n", "sample": true}, {"input": "12\n", "output": "Not prime\n", "sample": false}, {"input": "2\n", "output": "Prime\n", "sample": false}, {"input": "97\n", "output": "Prime\n", "sample": false}, {"input": "91\n", "output": "Not prime\n", "sample": false}], "hints": ["ראשוני = אין לו מחלק בין 2 ל-n-1. צריך לנסות את כולם בלולאה.", "ברגע שמצאנו מחלק אחד, כבר ידוע שהוא לא ראשוני – אפשר לצאת מהפונקציה עם return false.", "for (int d = 2; d * d <= n; d++) – מספיק לבדוק עד השורש, כי מחלק גדול תמיד בא בזוג עם מחלק קטן."], "explanation": "הפונקציה IsPrime מנסה לחלק את n בכל d מ-2 עד שורש n. אם יש חלוקה בלי שארית היא מחזירה false מיד, ואם הלולאה הסתיימה בלי למצוא מחלק היא מחזירה true.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (IsPrime(n)) Console.WriteLine(\"Prime\");\n        else Console.WriteLine(\"Not prime\");\n    }\n\n    static bool IsPrime(int n)\n    {\n        for (int d = 2; d * d <= n; d++)\n        {\n            if (n % d == 0) return false;\n        }\n        return true;\n    }\n}\n"}, {"id": "lc-07", "level": "מבחן", "title": "דירוג ציונים", "statement": "קלוט N ואחריו N ציונים (0–100). לכל ציון הדפס את הדירוג שלו: 90 ומעלה A, 80–89 B, 70–79 C, 55–69 D, מתחת ל-55 F. בסוף הדפס: Failed: <כמה קיבלו F>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n95\n82\n54\n70\n", "output": "A\nB\nF\nC\nFailed: 1\n", "sample": true}, {"input": "2\n100\n55\n", "output": "A\nD\nFailed: 0\n", "sample": false}, {"input": "3\n0\n10\n89\n", "output": "F\nF\nB\nFailed: 2\n", "sample": false}], "hints": ["לכל ציון מדפיסים משהו מיד בתוך הלולאה, והמונה מודפס רק בסוף.", "אם בודקים מהגבוה לנמוך (90, 80, 70...) לא צריך גבול עליון – ה-else if כבר מסנן.", "ב-else האחרון (F) צריך שני דברים: להדפיס F וגם failed++ – לכן סוגריים מסולסלים."], "explanation": "לכל ציון שרשרת else if מהגבוה לנמוך מדפיסה את הדירוג. רק בענף של F מגדילים את מונה הנכשלים, ואחרי הלולאה מדפיסים אותו.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int failed = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int g = int.Parse(Console.ReadLine());\n            if (g >= 90) Console.WriteLine(\"A\");\n            else if (g >= 80) Console.WriteLine(\"B\");\n            else if (g >= 70) Console.WriteLine(\"C\");\n            else if (g >= 55) Console.WriteLine(\"D\");\n            else\n            {\n                Console.WriteLine(\"F\");\n                failed++;\n            }\n        }\n        Console.WriteLine(\"Failed: \" + failed);\n    }\n}\n"}, {"id": "lc-08", "level": "מבחן", "title": "קופה בחנות", "statement": "קלוט N מוצרים. לכל מוצר קלוט מחיר (double) ואחריו true/false האם הלקוח חבר מועדון. לחבר מועדון יש 10% הנחה על המוצר. הדפס את הסכום הכולל לתשלום מעוגל ל-2 ספרות בעזרת Math.Round.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "2\n100\ntrue\n50\nfalse\n", "output": "140\n", "sample": true}, {"input": "1\n19.9\nfalse\n", "output": "19.9\n", "sample": false}, {"input": "3\n10\ntrue\n10\ntrue\n10\ntrue\n", "output": "27\n", "sample": false}], "hints": ["לכל מוצר יש שתי שורות קלט: מחיר ואז true/false.", "bool.Parse הופך את הטקסט true/false לערך אמת. המחיר עשרוני – double.Parse עם CultureInfo.InvariantCulture כדי שהנקודה תיקרא נכון.", "if (member) total += price * 0.9; else total += price; ובסוף Math.Round(total, 2)."], "explanation": "בכל סיבוב קולטים מחיר וחברות מועדון. אם הלקוח חבר מוסיפים 90% מהמחיר, אחרת את כולו. בסוף מעגלים את הסכום ל-2 ספרות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        double total = 0;\n        for (int i = 0; i < n; i++)\n        {\n            double price = double.Parse(Console.ReadLine(), System.Globalization.CultureInfo.InvariantCulture);\n            bool member = bool.Parse(Console.ReadLine());\n            if (member) total += price * 0.9;\n            else total += price;\n        }\n        Console.WriteLine(Math.Round(total, 2));\n    }\n}\n"}, {"id": "lc-09", "level": "מבחן", "title": "סכום ספרות זוגי", "statement": "קלוט N ואחריו N מספרים שלמים חיוביים. הדפס כמה מהם הם בעלי סכום ספרות זוגי. כתבו פונקציה static int DigitSum(int n).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n11\n12\n4\n", "output": "2\n", "sample": true}, {"input": "2\n1\n3\n", "output": "0\n", "sample": false}, {"input": "4\n99\n100\n55\n123\n", "output": "3\n", "sample": false}], "hints": ["חישוב סכום ספרות חוזר על עצמו לכל מספר – מתאים לפונקציה.", "הפונקציה מקבלת מספר ומחזירה int: static int DigitSum(int n).", "בתוך הלולאה הראשית: if (DigitSum(x) % 2 == 0) count++;"], "explanation": "הפונקציה DigitSum מחשבת סכום ספרות עם while, % 10 ו-/ 10. התוכנית קולטת N מספרים ולכל אחד בודקת אם סכום הספרות זוגי, וסופרת.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int count = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            if (DigitSum(x) % 2 == 0) count++;\n        }\n        Console.WriteLine(count);\n    }\n\n    static int DigitSum(int n)\n    {\n        int sum = 0;\n        while (n > 0)\n        {\n            sum += n % 10;\n            n /= 10;\n        }\n        return sum;\n    }\n}\n"}, {"id": "lc-10", "level": "מבחן", "title": "ספרת ביקורת", "statement": "קלוט N ואחריו N מספרים בני 6 ספרות. מספר תקין אם ספרת האחדות שלו שווה לספרת האחדות של סכום 5 הספרות האחרות. לדוגמה 123455: 1+2+3+4+5=15, ספרת האחדות 5 – תקין. הדפס כמה מספרים תקינים.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n123455\n123456\n111115\n", "output": "2\n", "sample": true}, {"input": "2\n999995\n100001\n", "output": "2\n", "sample": false}, {"input": "1\n500005\n", "output": "1\n", "sample": false}], "hints": ["פרקו את המספר לשני חלקים: ספרת הביקורת (x % 10) ושאר המספר (x / 10).", "על 'שאר המספר' מחשבים סכום ספרות כמו שכבר למדתם.", "תקין אם sum % 10 == check – משווים את ספרת האחדות של הסכום, לא את הסכום כולו."], "explanation": "לכל מספר מפרידים את ספרת האחדות, וסוכמים את חמש הספרות האחרות בלולאת while. אם ספרת האחדות של הסכום שווה לספרת הביקורת, סופרים את המספר כתקין.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int valid = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            int check = x % 10;\n            int rest = x / 10;\n            int sum = 0;\n            while (rest > 0)\n            {\n                sum += rest % 10;\n                rest /= 10;\n            }\n            if (sum % 10 == check) valid++;\n        }\n        Console.WriteLine(valid);\n    }\n}\n"}, {"id": "lc-11", "level": "מבחן", "title": "חניון", "statement": "קלוט N מכוניות ואחריו מספר שעות חניה (שלם, לפחות 1) לכל מכונית. התעריף: שעה ראשונה 10 ש\"ח, כל שעה נוספת 6 ש\"ח, ותשלום מקסימלי של 50 ש\"ח. הדפס:\nTotal: <סך ההכנסות>\nMax paid: <כמה מכוניות שילמו את המקסימום>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n1\n3\n10\n", "output": "Total: 82\nMax paid: 1\n", "sample": true}, {"input": "2\n7\n8\n", "output": "Total: 96\nMax paid: 1\n", "sample": false}, {"input": "1\n5\n", "output": "Total: 34\nMax paid: 0\n", "sample": false}], "hints": ["קודם חשבו מחיר לפי הנוסחה, ורק אז בדקו את התקרה.", "שעה ראשונה 10, ושאר השעות (hours - 1) כפול 6.", "if (price >= 50) { price = 50; maxPaid++; } – משתמשים ב->= כי מי שיוצא בדיוק 50 גם שילם מקסימום."], "explanation": "לכל מכונית מחשבים 10 + (hours - 1) * 6. אם התוצאה מגיעה ל-50 או עוברת אותו, קובעים 50 וסופרים אותה. מוסיפים את המחיר לסך ההכנסות ומדפיסים בסוף.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int total = 0;\n        int maxPaid = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int hours = int.Parse(Console.ReadLine());\n            int price = 10 + (hours - 1) * 6;\n            if (price >= 50)\n            {\n                price = 50;\n                maxPaid++;\n            }\n            total += price;\n        }\n        Console.WriteLine(\"Total: \" + total);\n        Console.WriteLine(\"Max paid: \" + maxPaid);\n    }\n}\n"}]}, {"id": "exam-sim", "title": "סימולציית מבחן", "order": 7, "intro": "כאן השאלות בנויות כמו במבחן האמיתי: קוראים את השאלה עד הסוף, מחלקים לחלקים קטנים (קלט, חישוב, פלט), וכדאי לכתוב פונקציות static לכל חלק. הקפידו על פורמט הפלט בדיוק כמו שכתוב!\n\nטיפ: פונקציה שמחזירה ערך:\nstatic int Twice(int x)\n{\n    return x * 2;\n}", "exercises": [{"id": "exam-01", "level": "קל", "title": "מחירון גילאים", "statement": "קלוט גיל של מבקר בפארק והדפס את מחיר הכרטיס. מחיר לפי גיל: מתחת ל-6 – 0 ש\"ח, 6 עד 17 – 40 ש\"ח, 18 עד 64 – 80 ש\"ח, 65 ומעלה – 50 ש\"ח.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n", "output": "0\n", "sample": true}, {"input": "6\n", "output": "40\n", "sample": true}, {"input": "17\n", "output": "40\n", "sample": false}, {"input": "40\n", "output": "80\n", "sample": false}, {"input": "65\n", "output": "50\n", "sample": false}], "hints": ["יש 4 טווחי גילאים, אז שרשרת if / else if.", "בודקים מהקטן לגדול: age < 6, אחר כך age < 18, אחר כך age < 65.", "בפונקציה AgePrice כל ענף מחזיר מחיר עם return, וזה גם עוצר את הפונקציה."], "explanation": "הפונקציה AgePrice בודקת את הגיל מהטווח הנמוך לגבוה ומחזירה את המחיר המתאים. ה-Main קולט גיל ומדפיס את מה שהפונקציה החזירה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        Console.WriteLine(AgePrice(age));\n    }\n\n    static int AgePrice(int age)\n    {\n        if (age < 6) return 0;\n        if (age < 18) return 40;\n        if (age < 65) return 80;\n        return 50;\n    }\n}\n"}, {"id": "exam-02", "level": "קל", "title": "תוספת VIP", "statement": "קלוט גיל ואחריו true/false האם המבקר VIP. מחיר לפי גיל: מתחת ל-6 – 0 ש\"ח, 6 עד 17 – 40 ש\"ח, 18 עד 64 – 80 ש\"ח, 65 ומעלה – 50 ש\"ח. למבקר VIP יש תוספת של 50% למחיר. הדפס את המחיר הסופי (מספר עשרוני, למשל 120).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "20\ntrue\n", "output": "120\n", "sample": true}, {"input": "20\nfalse\n", "output": "80\n", "sample": false}, {"input": "10\ntrue\n", "output": "60\n", "sample": false}, {"input": "3\ntrue\n", "output": "0\n", "sample": false}], "hints": ["קודם המחיר הרגיל לפי גיל (אפשר להשתמש ב-AgePrice), ואז התוספת.", "תוספת 50% פירושה המחיר כפול 1.5 – התוצאה יכולה להיות עשרונית, אז double.", "if (vip) price = price * 1.5;"], "explanation": "מחשבים מחיר בסיס לפי גיל ושומרים ב-double. אם המבקר VIP כופלים ב-1.5, ומדפיסים את התוצאה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        bool vip = bool.Parse(Console.ReadLine());\n        double price = AgePrice(age);\n        if (vip) price = price * 1.5;\n        Console.WriteLine(price);\n    }\n\n    static int AgePrice(int age)\n    {\n        if (age < 6) return 0;\n        if (age < 18) return 40;\n        if (age < 65) return 80;\n        return 50;\n    }\n}\n"}, {"id": "exam-03", "level": "קל", "title": "בדיקת כרטיס", "statement": "קלוט מספר כרטיס בן 6 ספרות. הכרטיס תקין אם ספרת האחדות שלו שווה לספרת האחדות של סכום 5 הספרות האחרות. הדפס Valid או Fake.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "123455\n", "output": "Valid\n", "sample": true}, {"input": "123456\n", "output": "Fake\n", "sample": false}, {"input": "999995\n", "output": "Valid\n", "sample": false}, {"input": "100001\n", "output": "Valid\n", "sample": false}], "hints": ["פרקו: ספרת הביקורת היא ticket % 10, ושאר הספרות הן ticket / 10.", "סכמו את הספרות של ticket / 10 בלולאת while.", "הפונקציה מחזירה sum % 10 == check – ביטוי שהוא כבר true או false."], "explanation": "IsValidTicket מפרידה את ספרת הביקורת, סוכמת את שאר הספרות, ומחזירה האם ספרת האחדות של הסכום שווה לביקורת. Main מדפיס Valid או Fake לפי התשובה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int ticket = int.Parse(Console.ReadLine());\n        if (IsValidTicket(ticket)) Console.WriteLine(\"Valid\");\n        else Console.WriteLine(\"Fake\");\n    }\n\n    static bool IsValidTicket(int ticket)\n    {\n        int check = ticket % 10;\n        int rest = ticket / 10;\n        int sum = 0;\n        while (rest > 0)\n        {\n            sum += rest % 10;\n            rest /= 10;\n        }\n        return sum % 10 == check;\n    }\n}\n"}, {"id": "exam-04", "level": "בינוני", "title": "ציון סופי לתלמיד", "statement": "קלוט שלושה מספרים שלמים: ציון מבחן, ציון עבודה ואחוז נוכחות. ציון סופי = (int)Math.Round(exam * 0.7 + work * 0.3). אם הנוכחות מתחת ל-80 – מורידים 5 נקודות. אם הנוכחות 95 ומעלה – מוסיפים 3 נקודות, אבל הציון לא יעלה על 100 (וגם לא ירד מתחת ל-0). סטטוס: 55 ומעלה \"עובר\", 45 עד 54 \"זכאי למועד ב\", מתחת ל-45 \"נכשל\".\nהדפס שתי שורות:\nFinal: <ציון סופי>\n<סטטוס>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "80\n90\n85\n", "output": "Final: 83\nעובר\n", "sample": true}, {"input": "100\n100\n99\n", "output": "Final: 100\nעובר\n", "sample": true}, {"input": "50\n40\n70\n", "output": "Final: 42\nנכשל\n", "sample": false}, {"input": "40\n30\n96\n", "output": "Final: 40\nנכשל\n", "sample": false}], "hints": ["חלקו לשלבים: חישוב בסיסי, תיקון לפי נוכחות, תקרה של 100, סטטוס.", "הנוכחות היא אחד משלושה מצבים (מתחת ל-80, 95 ומעלה, באמצע) – if / else if.", "את התקרה בודקים אחרי התוספת: if (final > 100) final = 100; ואת הסטטוס בפונקציה נפרדת."], "explanation": "FinalGrade מחשבת 70% מבחן ו-30% עבודה ומעגלת, ואז מורידה 5 או מוסיפה 3 לפי הנוכחות ומגבילה ל-0–100. Status בודקת את הציון הסופי ומחזירה את המחרוזת המתאימה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int exam = int.Parse(Console.ReadLine());\n        int work = int.Parse(Console.ReadLine());\n        int attendance = int.Parse(Console.ReadLine());\n        int final = FinalGrade(exam, work, attendance);\n        Console.WriteLine(\"Final: \" + final);\n        Console.WriteLine(Status(final));\n    }\n\n    static int FinalGrade(int exam, int work, int attendance)\n    {\n        int final = (int)Math.Round(exam * 0.7 + work * 0.3);\n        if (attendance < 80) final -= 5;\n        else if (attendance >= 95) final += 3;\n        if (final > 100) final = 100;\n        if (final < 0) final = 0;\n        return final;\n    }\n\n    static string Status(int final)\n    {\n        if (final >= 55) return \"עובר\";\n        if (final >= 45) return \"זכאי למועד ב\";\n        return \"נכשל\";\n    }\n}\n"}, {"id": "exam-05", "level": "בינוני", "title": "הנחה בחנות", "statement": "קלוט סכום קנייה (double). אם הסכום 1000 ומעלה – 15% הנחה, אם 500 ומעלה – 10% הנחה, אחרת אין הנחה. הדפס את הסכום לתשלום מעוגל ל-2 ספרות בעזרת Math.Round.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "1000\n", "output": "850\n", "sample": true}, {"input": "999.9\n", "output": "899.91\n", "sample": false}, {"input": "200\n", "output": "200\n", "sample": false}, {"input": "500\n", "output": "450\n", "sample": false}], "hints": ["שתי מדרגות הנחה – הגבוהה צריכה להיבדק ראשונה.", "אם בודקים קודם '500 ומעלה', גם 1000 ייתפס שם ויקבל רק 10%.", "הנחה של 15% = total * 0.85, הנחה של 10% = total * 0.9, וקליטה עם double.Parse(..., CultureInfo.InvariantCulture)."], "explanation": "קולטים סכום עשרוני. בודקים קודם אם הוא 1000 ומעלה, אחר כך 500 ומעלה, ומחילים את ההנחה המתאימה. בסוף מעגלים ל-2 ספרות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        double total = double.Parse(Console.ReadLine(), System.Globalization.CultureInfo.InvariantCulture);\n        if (total >= 1000) total = total * 0.85;\n        else if (total >= 500) total = total * 0.9;\n        Console.WriteLine(Math.Round(total, 2));\n    }\n}\n"}, {"id": "exam-06", "level": "בינוני", "title": "מעלית", "statement": "מעלית מחזיקה עד 400 ק\"ג. קלוט N אנשים ואחריו משקל (שלם) של כל אחד לפי סדר העמידה בתור. האנשים נכנסים לפי הסדר; ברגע שמישהו לא נכנס (המשקל הכולל יעבור 400) – אף אחד אחריו לא נכנס. הדפס:\nEntered: <כמה נכנסו>\nWeight: <המשקל הכולל במעלית>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n100\n120\n90\n100\n50\n", "output": "Entered: 3\nWeight: 310\n", "sample": true}, {"input": "2\n200\n200\n", "output": "Entered: 2\nWeight: 400\n", "sample": false}, {"input": "3\n500\n10\n10\n", "output": "Entered: 0\nWeight: 0\n", "sample": false}], "hints": ["צריך לזכור אם המעלית 'נסגרה' – משתנה bool עוזר לזכור מצב.", "אדם נכנס רק אם המעלית לא נסגרה וגם המשקל אחרי הכניסה לא עובר 400.", "גם אחרי שהמעלית נסגרה, הלולאה ממשיכה לקלוט – אחרת שורות הקלט יתבלבלו."], "explanation": "הלולאה קולטת את כל המשקלים לפי הסדר. כל עוד full הוא false ויש מקום, האדם נכנס. ברגע שמישהו לא נכנס, full הופך ל-true ואף אחד אחריו לא נכנס.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int weight = 0;\n        int entered = 0;\n        bool full = false;\n        for (int i = 0; i < n; i++)\n        {\n            int w = int.Parse(Console.ReadLine());\n            if (!full && weight + w <= 400)\n            {\n                weight += w;\n                entered++;\n            }\n            else\n            {\n                full = true;\n            }\n        }\n        Console.WriteLine(\"Entered: \" + entered);\n        Console.WriteLine(\"Weight: \" + weight);\n    }\n}\n"}, {"id": "exam-07", "level": "בינוני", "title": "אוטובוס", "statement": "קלוט N נוסעים ואחריו גיל של כל נוסע. ילדים (מתחת ל-12) משלמים 3 ש\"ח, מבוגרים (12 עד 66) משלמים 6 ש\"ח, ותיקים (67 ומעלה) נוסעים בחינם. הדפס:\nChildren: <כמות>\nAdults: <כמות>\nSeniors: <כמות>\nRevenue: <סך ההכנסות>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n5\n30\n70\n12\n", "output": "Children: 1\nAdults: 2\nSeniors: 1\nRevenue: 15\n", "sample": true}, {"input": "1\n67\n", "output": "Children: 0\nAdults: 0\nSeniors: 1\nRevenue: 0\n", "sample": false}, {"input": "3\n11\n66\n1\n", "output": "Children: 2\nAdults: 1\nSeniors: 0\nRevenue: 12\n", "sample": false}], "hints": ["שלוש קבוצות גיל – שרשרת if / else if / else.", "בכל ענף עושים שני דברים: מגדילים מונה ומוסיפים להכנסות.", "גבולות: age < 12 ילד, age < 67 מבוגר, אחרת ותיק."], "explanation": "לכל נוסע מחליטים לפי הגיל לאיזו קבוצה הוא שייך, מגדילים את המונה שלה ומוסיפים את המחיר להכנסות. בסוף מדפיסים את ארבע השורות.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int children = 0, adults = 0, seniors = 0, revenue = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int age = int.Parse(Console.ReadLine());\n            if (age < 12)\n            {\n                children++;\n                revenue += 3;\n            }\n            else if (age < 67)\n            {\n                adults++;\n                revenue += 6;\n            }\n            else\n            {\n                seniors++;\n            }\n        }\n        Console.WriteLine(\"Children: \" + children);\n        Console.WriteLine(\"Adults: \" + adults);\n        Console.WriteLine(\"Seniors: \" + seniors);\n        Console.WriteLine(\"Revenue: \" + revenue);\n    }\n}\n"}, {"id": "exam-08", "level": "בינוני", "title": "ספרות עולות", "statement": "קלוט מספר בן 4 ספרות. אם כל ספרה גדולה ממש מהספרה שלפניה (משמאל לימין, למשל 1359) הדפס Yes, אחרת הדפס No.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "1359\n", "output": "Yes\n", "sample": true}, {"input": "1335\n", "output": "No\n", "sample": false}, {"input": "4321\n", "output": "No\n", "sample": false}, {"input": "1234\n", "output": "Yes\n", "sample": false}], "hints": ["קל יותר לעבור על הספרות מימין לשמאל (עם % 10) – ואז כל ספרה צריכה להיות קטנה מזו שמימינה.", "שמרו את הספרה הקודמת במשתנה last כדי להשוות.", "השתמשו ב-bool ok = true, ואם מוצאים זוג לא תקין (d >= last) מעבירים ל-false."], "explanation": "לוקחים את הספרה הימנית כ-last, ואז בלולאה עוברים שמאלה. אם ספרה כלשהי גדולה או שווה לזו שמימינה, המספר לא עולה. בסוף מדפיסים לפי ok.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        bool ok = true;\n        int last = n % 10;\n        n /= 10;\n        while (n > 0)\n        {\n            int d = n % 10;\n            if (d >= last) ok = false;\n            last = d;\n            n /= 10;\n        }\n        if (ok) Console.WriteLine(\"Yes\");\n        else Console.WriteLine(\"No\");\n    }\n}\n"}, {"id": "exam-09", "level": "מבחן", "title": "ציוני כיתה", "statement": "קלוט מספר תלמידים N. לכל תלמיד קלוט ציון מבחן, ציון עבודה ואחוז נוכחות (כל אחד בשורה). ציון סופי = (int)Math.Round(exam * 0.7 + work * 0.3). אם הנוכחות מתחת ל-80 – מורידים 5 נקודות. אם הנוכחות 95 ומעלה – מוסיפים 3 נקודות, אבל הציון לא יעלה על 100 (וגם לא ירד מתחת ל-0). סטטוס: 55 ומעלה \"עובר\", 45 עד 54 \"זכאי למועד ב\", מתחת ל-45 \"נכשל\".\nלכל תלמיד הדפס שורה: <ציון סופי> <סטטוס> (למשל: 83 עובר). בסוף הדפס:\nAverage: <ממוצע הציונים הסופיים מעוגל ל-2 ספרות בעזרת Math.Round>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "2\n80\n90\n85\n50\n40\n70\n", "output": "83 עובר\n42 נכשל\nAverage: 62.5\n", "sample": true}, {"input": "3\n100\n100\n99\n40\n30\n96\n20\n20\n50\n", "output": "100 עובר\n40 נכשל\n15 נכשל\nAverage: 51.67\n", "sample": false}, {"input": "1\n55\n55\n80\n", "output": "55 עובר\nAverage: 55\n", "sample": false}], "hints": ["זה תרגיל 'ציון סופי לתלמיד' בתוך לולאה – השתמשו שוב בפונקציות FinalGrade ו-Status.", "לכל תלמיד יש 3 שורות קלט, אז בכל סיבוב קולטים 3 מספרים.", "לממוצע: סכמו את הציונים הסופיים, ובסוף Math.Round((double)sum / n, 2)."], "explanation": "לכל תלמיד קולטים שלושה נתונים, מחשבים ציון סופי וסטטוס עם הפונקציות ומדפיסים שורה. הציון מתווסף לסכום, ואחרי הלולאה מדפיסים את הממוצע המעוגל.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int exam = int.Parse(Console.ReadLine());\n            int work = int.Parse(Console.ReadLine());\n            int attendance = int.Parse(Console.ReadLine());\n            int final = FinalGrade(exam, work, attendance);\n            sum += final;\n            Console.WriteLine(final + \" \" + Status(final));\n        }\n        Console.WriteLine(\"Average: \" + Math.Round((double)sum / n, 2));\n    }\n\n    static int FinalGrade(int exam, int work, int attendance)\n    {\n        int final = (int)Math.Round(exam * 0.7 + work * 0.3);\n        if (attendance < 80) final -= 5;\n        else if (attendance >= 95) final += 3;\n        if (final > 100) final = 100;\n        if (final < 0) final = 0;\n        return final;\n    }\n\n    static string Status(int final)\n    {\n        if (final >= 55) return \"עובר\";\n        if (final >= 45) return \"זכאי למועד ב\";\n        return \"נכשל\";\n    }\n}\n"}, {"id": "exam-10", "level": "מבחן", "title": "פארק שעשועים", "statement": "בפארק נכנסים N מבקרים (במבחן N=120, כאן קולטים את N). לכל מבקר קולטים: מספר כרטיס בן 6 ספרות, גיל, ו-true/false האם VIP. כרטיס תקין אם ספרת האחדות שלו שווה לספרת האחדות של סכום 5 הספרות האחרות. מבקר עם כרטיס מזויף לא נכנס ולא משלם. מחיר לפי גיל: מתחת ל-6 – 0 ש\"ח, 6 עד 17 – 40 ש\"ח, 18 עד 64 – 80 ש\"ח, 65 ומעלה – 50 ש\"ח. ל-VIP תוספת של 50%.\nהדפס שלוש שורות:\nFake: <מספר הכרטיסים המזויפים>\nAverage price: <ממוצע המחיר של המבקרים התקינים, מעוגל ל-2 ספרות בעזרת Math.Round>\nVIP percent: <אחוז ה-VIP מתוך המבקרים התקינים, מעוגל ל-2 ספרות>\nאם אין אף מבקר תקין, הדפס 0 בשתי השורות האחרונות.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n123455\n20\ntrue\n123456\n30\nfalse\n111115\n10\nfalse\n", "output": "Fake: 1\nAverage price: 80\nVIP percent: 50\n", "sample": true}, {"input": "2\n123456\n20\ntrue\n111111\n5\nfalse\n", "output": "Fake: 2\nAverage price: 0\nVIP percent: 0\n", "sample": false}, {"input": "4\n999995\n70\ntrue\n500005\n3\nfalse\n123455\n17\nfalse\n100001\n40\ntrue\n", "output": "Fake: 0\nAverage price: 58.75\nVIP percent: 50\n", "sample": false}], "hints": ["זו שאלה גדולה – חלקו אותה: בדיקת כרטיס (פונקציה), מחיר לפי גיל (פונקציה), וספירות בלולאה.", "מבקר מזויף לא משלם ולא נספר ב-VIP, לכן כל החישובים האחרים נמצאים בתוך else.", "ממוצע = total / valid, אחוז VIP = vipCount * 100.0 / valid – ובדקו valid == 0 לפני שמחלקים."], "explanation": "לכל מבקר קולטים כרטיס, גיל ו-VIP. אם הכרטיס מזויף סופרים אותו, ואחרת מחשבים מחיר (עם תוספת VIP) וסוכמים. בסוף מדפיסים מזויפים, ממוצע מחיר ואחוז VIP מתוך התקינים, עם הגנה מחלוקה באפס.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int fake = 0, valid = 0, vipCount = 0;\n        double total = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int ticket = int.Parse(Console.ReadLine());\n            int age = int.Parse(Console.ReadLine());\n            bool vip = bool.Parse(Console.ReadLine());\n            if (!IsValidTicket(ticket))\n            {\n                fake++;\n            }\n            else\n            {\n                valid++;\n                double price = AgePrice(age);\n                if (vip)\n                {\n                    price *= 1.5;\n                    vipCount++;\n                }\n                total += price;\n            }\n        }\n        Console.WriteLine(\"Fake: \" + fake);\n        if (valid == 0)\n        {\n            Console.WriteLine(\"Average price: 0\");\n            Console.WriteLine(\"VIP percent: 0\");\n        }\n        else\n        {\n            Console.WriteLine(\"Average price: \" + Math.Round(total / valid, 2));\n            Console.WriteLine(\"VIP percent: \" + Math.Round(vipCount * 100.0 / valid, 2));\n        }\n    }\n\n    static bool IsValidTicket(int ticket)\n    {\n        int check = ticket % 10;\n        int rest = ticket / 10;\n        int sum = 0;\n        while (rest > 0)\n        {\n            sum += rest % 10;\n            rest /= 10;\n        }\n        return sum % 10 == check;\n    }\n\n    static int AgePrice(int age)\n    {\n        if (age < 6) return 0;\n        if (age < 18) return 40;\n        if (age < 65) return 80;\n        return 50;\n    }\n}\n"}, {"id": "exam-11", "level": "מבחן", "title": "מרוץ", "statement": "קלוט N רצים ואחריו זמן הריצה בשניות (שלם) של כל אחד. הדפס:\nBest: <הזמן הטוב ביותר (הקטן)>\nWinner: <מספר הרץ המנצח, מתחיל מ-1; אם יש תיקו – הראשון>\nUnder 60: <כמה רצים סיימו בפחות מ-60 שניות>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4\n65\n58\n70\n58\n", "output": "Best: 58\nWinner: 2\nUnder 60: 2\n", "sample": true}, {"input": "1\n90\n", "output": "Best: 90\nWinner: 1\nUnder 60: 0\n", "sample": false}, {"input": "3\n59\n61\n40\n", "output": "Best: 40\nWinner: 3\nUnder 60: 2\n", "sample": false}], "hints": ["צריך לזכור שני דברים על המנצח: הזמן שלו והמספר שלו.", "הזמן הטוב הוא הקטן ביותר – כמו מקסימום, רק הפוך.", "if (t < best) { best = t; winner = i; } – עם < ולא <=, כדי שבתיקו יישאר הראשון."], "explanation": "הלולאה רצה מ-1 עד N כדי ש-i יהיה מספר הרץ. כשנמצא זמן קטן יותר מעדכנים גם את הזמן וגם את המנצח, ובנפרד סופרים זמנים מתחת ל-60.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int best = int.MaxValue;\n        int winner = 0;\n        int under = 0;\n        for (int i = 1; i <= n; i++)\n        {\n            int t = int.Parse(Console.ReadLine());\n            if (t < best)\n            {\n                best = t;\n                winner = i;\n            }\n            if (t < 60) under++;\n        }\n        Console.WriteLine(\"Best: \" + best);\n        Console.WriteLine(\"Winner: \" + winner);\n        Console.WriteLine(\"Under 60: \" + under);\n    }\n}\n"}, {"id": "exam-12", "level": "מבחן", "title": "גשם", "statement": "קלוט N ימים ואחריו כמות הגשם במ\"מ (שלם, 0 ומעלה) בכל יום. יום גשום הוא יום עם יותר מ-0. הדפס:\nTotal: <סך הגשם>\nRainy days: <מספר הימים הגשומים>\nLongest streak: <הרצף הארוך ביותר של ימים גשומים ברצף>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "6\n0\n5\n3\n0\n2\n0\n", "output": "Total: 10\nRainy days: 3\nLongest streak: 2\n", "sample": true}, {"input": "3\n0\n0\n0\n", "output": "Total: 0\nRainy days: 0\nLongest streak: 0\n", "sample": false}, {"input": "5\n1\n1\n0\n1\n1\n", "output": "Total: 4\nRainy days: 4\nLon // ---------- editor with line numbers + current-line highlight ----------
const LH = 22;
// ---------- auto case-fix (closed list; only right after a word boundary; never in strings/comments) ----------
const AUTO_OBJ = { console: 'Console', math: 'Math', convert: 'Convert' };              // fixed only when followed by '.'
const AUTO_MEM = Object.fromEntries(['WriteLine', 'Write', 'ReadLine', 'Parse', 'Max', 'Min', 'Abs', 'Sqrt', 'Pow', 'Round', 'Floor', 'Ceiling',
  'ToInt32', 'ToDouble', 'ToString', 'Length', 'ToUpper', 'ToLower'].map(w => [w.toLowerCase(), w]));            // fixed only right after '.'
const autoCaseOn = () => localStorage.getItem('cq_autocase') !== '0';
function inStringOrComment(text, pos) {
  let i = 0, st = null; // st: '"', "'", '//', '/*'
  while (i < pos) {
    const c = text[i], n = text[i + 1];
    if (st === '//') { if (c === '\n') st = null; }
    else if (st === '/*') { if (c === '*' && n === '/') { st = null; i++; } }
    else if (st === '"' || st === "'") { if (c === '\\') i++; else if (c === st || c === '\n') st = null; }
    else if (c === '/' && n === '/') { st = '//'; i++; } else if (c === '/' && n === '*') { st = '/*'; i++; } else if (c === '"' || c === "'") st = c;
    i++;
  }
  return st !== null;
}
// end = index just after the word (where the boundary char is / will be); boundary = that char
function autoCaseFix(ta, end, boundary) {
  if (!autoCaseOn()) return false;
  const v = ta.value; let st = end; while (st > 0 && /[A-Za-z0-9_]/.test(v[st - 1])) st--;
  const w = v.slice(st, end); if (!w) return false; const lw = w.toLowerCase();
  const afterDot = v[st - 1] === '.';
  let to = null;
  if (!afterDot && boundary === '.' && AUTO_OBJ[lw] && /^[a-z]/.test(w)) to = AUTO_OBJ[lw];
  else if (afterDot && AUTO_MEM[lw]) to = AUTO_MEM[lw];
  if (!to || to === w || inStringOrComment(v, st)) return false;
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = v.slice(0, st) + to + v.slice(end); ta.selectionStart = a; ta.selectionEnd = b; // same length → cursor unchanged
  return true;
}
function setupEditor(id, starter) {
  const ta = $('#code'), gut = $('#gut'), hl = $('#hl');
  ta.value = localStorage.getItem('cq2_code_' + id) ?? (starter || STARTER);
  const upd = () => { gut.textContent = ta.value.split('\n').map((_, j) => j + 1).join('\n'); sync(); localStorage.setItem('cq2_code_' + id, ta.value); };
  const sync = () => { gut.scrollTop = ta.scrollTop; hl.style.transform = `translateY(${-ta.scrollTop}px)`; };
  ta.addEventListener('input', ev => {
    if (ev && ev.data && /^[.( ;)\n,]$/.test(ev.data.slice(-1)) && ta.selectionStart === ta.selectionEnd) autoCaseFix(ta, ta.selectionStart - 1, ev.data.slice(-1));
    else if (ev && ev.inputType === 'insertLineBreak') autoCaseFix(ta, ta.selectionStart - 1, '\n');
    upd();
  });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', ev => {
    const s = ta.selectionStart;
    if (ev.key === 'Tab') { ev.preventDefault(); ta.setRangeText('    ', s, ta.selectionEnd, 'end'); upd(); }
    else if (ev.key === 'Enter' && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); if (ta.selectionStart === ta.selectionEnd) autoCaseFix(ta, s, '\n'); const ls = ta.value.lastIndexOf('\n', s - 1) + 1; let ind = ta.value.slice(ls, s).match(/^\s*/)[0]; if (ta.value[s - 1] === '{') ind += '    '; ta.setRangeText('\n' + ind, s, ta.selectionEnd, 'end'); upd(); }
    else if (ev.key === '}') { const ls = ta.value.lastIndexOf('\n', s - 1) + 1; const b = ta.value.slice(ls, s); if (/^\s{4,}$/.test(b)) { ev.preventDefault(); ta.setRangeText(b.slice(4) + '}', ls, s, 'end'); upd(); } }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); $('#checkBtn').click(); }
  });
  upd();
  return { mark(line, kind) { if (!line) { hl.style.display = 'none'; return; } hl.style.display = 'block'; hl.className = 'hl ' + (kind || ''); hl.style.top = (12 + (line - 1) * LH) + 'px';
      const top = (line - 1) * LH; if (top < ta.scrollTop || top > ta.scrollTop + ta.clientHeight - 2 * LH) { ta.scrollTop = top - 3 * LH; sync(); } } };
}
function errHTML(e) { const fx = e.fixes && e.fixes.length ? ` <button class="big green fixbtn" data-fixes="${esc(JSON.stringify(e.fixes))}">🔧 ${lang === 'he' ? 'תקן' : 'Fix'}</button>` : ''; return `<div class="errbox"><b>❌ ${u('errLine')} ${e.line || '?'}</b>${fx}<div>${esc(lang === 'he' ? (e.he || e.message) : e.message)}</div><div class="sub">${esc(lang === 'he' ? e.message : (e.he || ''))}</div></div>`; }

// one-click fix for case mistakes (console -> Console, int.parse -> int.Parse)
document.addEventListener('click', ev => {
  const b = ev.target.closest('.fixbtn'); if (!b) return;
  const ta = $('#code'); if (!ta) return; let code = ta.value;
  for (const f of JSON.parse(b.dataset.fixes)) {
    const lines = code.split('\n'); const re = new RegExp('(^|[^\\w"])' + f.from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w])', 'g');
    const li = f.line - 1;
    if (lines[li] !== undefined && re.test(lines[li])) { re.lastIndex = 0; lines[li] = lines[li].replace(re, (m, p) => p + f.to); }
    code = lines.join('\n');
  }
  ta.value = code; ta.dispatchEvent(new Event('input')); b.closest('.errbox').remove();
  status(lang === 'he' ? '🔧 תוקן! עכשיו נסו להריץ שוב.' : '🔧 Fixed! Now try running again.', 'happy');
});
// quick keys: '|' marks where the cursor goes
const QKEYS = [
  ['WriteLine', 'Console.WriteLine(|);'], ['ReadLine', 'Console.ReadLine()'], ['int.Parse', 'int.Parse(Console.ReadLine())'], ['double.Parse', 'double.Parse(Console.ReadLine())'],
  ['if', 'if (|)\n{\n    \n}'], ['else', 'else\n{\n    |\n}'], ['for', 'for (int i = 0; i < |; i++)\n{\n    \n}'], ['while', 'while (|)\n{\n    \n}'],
  ['Math.', 'Math.|'], ['( )', '(|)'], ['{ }', '{\n    |\n}'], ['" "', '"|"'], [';', ';'], ['==', ' == '], ['&&', ' && '], ['||', ' || '], ['%', ' % '], ['Tab', '    ']
];
function setupQuickKeys() {
  const bar = $('#qkeys'); if (!bar) return;
  bar.innerHTML = QKEYS.map(([l], i) => `<button type="button" class="qk" data-i="${i}">${esc(l)}</button>`).join('');
  bar.addEventListener('mousedown', ev => { if (ev.target.closest('.qk')) ev.preventDefault(); }); // keep editor focus
  bar.addEventListener('click', ev => {
    const b = ev.target.closest('.qk'); if (!b) return; const ta = $('#code'); const tpl = QKEYS[+b.dataset.i][1];
    const s = ta.selectionStart, ls = ta.value.lastIndexOf('\n', s - 1) + 1, ind = ta.value.slice(ls, s).match(/^\s*/)[0];
    let txt = tpl.split('\n').map((l, j) => j ? ind + l : l).join('\n'); let pos = txt.indexOf('|');
    if (pos < 0) pos = txt.length; else txt = txt.replace('|', '');
    if (pos === txt.length && /\n {4}\n/.test(txt)) pos = txt.indexOf('\n    ') + 5 + ind.length; // inside the block
    ta.focus(); ta.setRangeText(txt, s, ta.selectionEnd, 'start'); ta.selectionStart = ta.selectionEnd = s + pos; ta.dispatchEvent(new Event('input'));
  });
}

  function animate(trace, res, done) {

    const add = (txt, cls) => { scr.querySelector('.cursor')?.remove(); const sp = document.createElement('span'); sp.className = cls; sp.textContent = txt; scr.appendChild(sp); cur(); return sp; };
    cur();
    const lines = trace.filter((x, j) => !(x.k === 'line' && trace[j + 1] && trace[j + 1].k === 'line' && trace.length > 600));
    const step = () => {

    } else {

function tour() {
  const steps = TOUR[lang].filter(s => document.querySelector(s[0])); let k = 0;
  const ov = document.createElement('div'); ov.className = 'tour'; ov.innerHTML = '<div class="spot"></div><div class="tcard"></div>'; document.body.appendChild(ov);
  const spot = ov.querySelector('.spot'), card = ov.querySelector('.tcard');
  const end = () => { ov.remove(); localStorage.setItem('cq_tour_done', 1); removeEventListener('resize', show); };
  function show() {
    const [sel, h, txt] = steps[k]; const el = document.querySelector(sel);
    el.scrollIntoView({ block: 'center', behavior: 'instant' });
    const r = el.getBoundingClientRect(), pad = 8;
    Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px' });
    card.innerHTML = `<div class="tk">${mascot('happy')}<div><b>${h}</b> <small>${k + 1}/${steps.length}</small><p>${txt}</p></div></div>
      <div class="tb"><button class="mini" data-a="skip">${lang === 'he' ? 'דלג' : 'Skip'}</button>${k ? `<button class="big ghost" data-a="prev">${lang === 'he' ? 'הקודם' : 'Back'}</button>` : ''}<button class="big orange" data-a="next">${k < steps.length - 1 ? (lang === 'he' ? 'הבא' : 'Next') : (lang === 'he' ? 'יאללה, מתחילים! 🚀' : "Let's go! 🚀")}</button></div>`;
    const cw = Math.min(380, innerWidth - 20); card.style.width = cw + 'px';
    const below = r.bottom + 16 + 230 < innerHeight;
    card.style.top = (below ? r.bottom + 16 : Math.max(10, r.top - 16 - card.offsetHeight)) + 'px';
    card.style.left = Math.min(Math.max(10, r.left + r.width / 2 - cw / 2), innerWidth - cw - 10) + 'px';
  }
  card.addEventListener('click', ev => { const a = ev.target.closest('[data-a]')?.dataset.a; if (a === 'next') { if (++k >= steps.length) end(); else show(); } else if (a === 'prev') { k--; show(); } else if (a === 'skip') end(); });
  ov.addEventListener('click', ev => { if (ev.target === ov || ev.target === spot) { if (++k >= steps.length) end(); else show(); } });
  addEventListener('resize', show); show();
}

function win(t, i, stars) {
  const hasNext = i < t.exercises.length - 1;
  const md = modal(`<div class="win"><div class="winkodi">${mascot('happy')}</div><h2>${u('winT')}</h2><p>${u('winS')} ✓</p>
    <div class="bigstars">${[1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div>
    ${stars < 3 ? `<p class="small">${lang === 'he' ? (stars === 2 ? 'השתמשתם ברמז – נסו את הבא בלי רמזים לשלושה כוכבים!' : 'הצצתם בפתרון – נסו שוב בלי עזרה בתרגיל הבא 💪') : (stars === 2 ? 'You used a hint – try the next one without hints for 3 stars!' : 'You peeked at the solution – try the next one on your own 💪')}</p>` : ''}
    <div class="mbtns2">${hasNext ? `<a class="big orange" href="#${t.id}/${i + 1}">${u('next')}</a>` : ''}<a class="big ghost" href="#${t.id}">${u('map')}</a></div></div>`, 'winm');
  md.querySelectorAll('a').forEach(a => a.addEventListener('click', () => md.remove()));
  status(lang === 'he' ? 'יששש! 🎉 הצלחתם!' : 'Yesss! 🎉 You did it!', 'happy');
  confetti();
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  for (let n = 0; n < 70; n++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.background = `hsl(${Math.random() * 360},95%,60%)`; s.style.animationDelay = Math.random() * .6 + 's'; s.style.animationDuration = 1.6 + Math.random() + 's'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3200);
}
route();
})();
</script>
