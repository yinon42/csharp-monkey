<script>// Mini C# interpreter (console subset) — supports int/double/bool/string/char, if/else, loops,
// static methods, Console.ReadLine/Write/WriteLine, Parse, Math, casts, interpolation.
(function (root) {
'use strict';
class CsError extends Error { constructor(msg, line, he, fixes) { super(msg); this.line = line; this.he = he; if (fixes) this.fixes = fixes; } }
// canonical names for case-mismatch hints (C# stays case-sensitive; we only suggest)
const KNOWN_OBJS = ['Console', 'Math', 'Convert', 'int', 'double', 'bool', 'string', 'long', 'char'];
const KNOWN_MEMBERS = { Console: ['WriteLine', 'Write', 'ReadLine'], Math: ['Min', 'Max', 'Abs', 'Pow', 'Sqrt', 'Round', 'Floor', 'Ceiling', 'Truncate', 'Clamp', 'PI'], Convert: ['ToInt32', 'ToDouble', 'ToBoolean', 'ToString'],
  int: ['Parse', 'MaxValue', 'MinValue'], double: ['Parse', 'MaxValue'], bool: ['Parse'], long: ['Parse'], string: ['Format', 'Join'] };
const ROBOT_NAMES = ['Move', 'TurnLeft', 'TurnRight', 'Collect', 'IsPathClear', 'IsOnStar', 'AtGoal'];
const CASE_MSG = (full) => `ב-C# יש הבדל בין אותיות גדולות לקטנות. אולי התכוונת ל-${full}?`;
function ciFind(list, name) { return list.find(k => k.toLowerCase() === String(name).toLowerCase() && k !== name); }
const TYPES = ['int','double','bool','string','var','char','long','float','void'];
const KW = new Set(['if','else','while','for','do','break','continue','return','true','false','null','new','class','static','public','private','using','namespace','internal','const','foreach','in']);
const OPS = ['<<=','>>=','==','!=','<=','>=','&&','||','++','--','+=','-=','*=','/=','%=','=>','+','-','*','/','%','<','>','=','!','(',')','{','}','[',']',';',',','.','?',':'];

function tokenize(src) {
  const toks = []; let i = 0, line = 1;
  const push = (t, v, extra) => toks.push(Object.assign({ t, v, line }, extra || {}));
  while (i < src.length) {
    const c = src[i];
    if (c === '\n') { line++; i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    if (c === '/' && src[i+1] === '/') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*') { i += 2; while (i < src.length && !(src[i] === '*' && src[i+1] === '/')) { if (src[i] === '\n') line++; i++; } i += 2; continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1]))) {
      let j = i; while (/[0-9]/.test(src[j])) j++;
      let isD = false;
      if (src[j] === '.' && /[0-9]/.test(src[j+1])) { isD = true; j++; while (/[0-9]/.test(src[j])) j++; }
      if (/[eE]/.test(src[j]) && /[0-9+-]/.test(src[j+1])) { isD = true; j++; if (/[+-]/.test(src[j])) j++; while (/[0-9]/.test(src[j])) j++; }
      let txt = src.slice(i, j);
      if (/[dDfFmM]/.test(src[j])) { isD = true; j++; } else if (/[lL]/.test(src[j])) j++;
      push('num', Number(txt), { isD }); i = j; continue;
    }
    if (c === '$' && src[i+1] === '"') { // interpolated string
      let j = i + 2, parts = [], cur = '';
      while (j < src.length && src[j] !== '"') {
        if (src[j] === '\\') { cur += esc(src[j+1]); j += 2; continue; }
        if (src[j] === '{' && src[j+1] === '{') { cur += '{'; j += 2; continue; }
        if (src[j] === '}' && src[j+1] === '}') { cur += '}'; j += 2; continue; }
        if (src[j] === '{') {
          let depth = 1, k = j + 1, inStr = false;
          while (k < src.length && depth > 0) { if (src[k] === '"') inStr = !inStr; else if (!inStr) { if (src[k] === '{') depth++; else if (src[k] === '}') depth--; } if (depth > 0) k++; }
          let inner = src.slice(j + 1, k), fmt = null;
          // format spec  {x:F2}  (ignore ':' inside ?: by taking last colon followed by letters/digits)
          const m = inner.match(/^(.*?):([A-Za-z]\d*|0\.0+|#\.#+)$/s);
          if (m && !/\?/.test(m[1].replace(/"[^"]*"/g,''))) { inner = m[1]; fmt = m[2]; }
          parts.push(cur); cur = ''; parts.push({ code: inner, fmt, line });
          j = k + 1; continue;
        }
        if (src[j] === '\n') throw new CsError('Newline in string', line, 'שורה חדשה בתוך מחרוזת – חסר " לסגירה');
        cur += src[j]; j++;
      }
      if (j >= src.length) throw new CsError('Unterminated string', line, 'מחרוזת לא נסגרה – חסר "');
      parts.push(cur); push('interp', parts); i = j + 1; continue;
    }
    if (c === '"') {
      let j = i + 1, s = '';
      while (j < src.length && src[j] !== '"') { if (src[j] === '\n') throw new CsError('Newline in string', line, 'מחרוזת לא נסגרה – חסר " בסוף השורה'); if (src[j] === '\\') { s += esc(src[j+1]); j += 2; } else s += src[j++]; }
      if (j >= src.length) throw new CsError('Unterminated string', line, 'מחרוזת לא נסגרה – חסר "');
      push('str', s); i = j + 1; continue;
    }
    if (c === "'") {
      let j = i + 1, s;
      if (src[j] === '\\') { s = esc(src[j+1]); j += 2; } else s = src[j++];
      if (src[j] !== "'") throw new CsError('Bad char literal', line, "תו (char) צריך להיות תו אחד בין גרשיים בודדים, למשל 'a'");
      push('char', s); i = j + 1; continue;
    }
    if (/[A-Za-z_\u0590-\u05FF]/.test(c)) {
      let j = i; while (j < src.length && /[A-Za-z0-9_\u0590-\u05FF]/.test(src[j])) j++;
      const w = src.slice(i, j);
      if (TYPES.includes(w)) push('type', w); else if (KW.has(w)) push('kw', w); else push('id', w);
      i = j; continue;
    }
    const op = OPS.find(o => src.startsWith(o, i));
    if (!op) throw new CsError(`Unexpected character '${c}'`, line, `תו לא מוכר: '${c}'`);
    push('op', op); i += op.length;
  }
  push('eof', null);
  for (const tk of toks) if (tk.t === 'id') {
    const kw = [...TYPES, ...KW].find(k => k === tk.v.toLowerCase() && k !== tk.v);
    if (kw && !['String', 'Boolean', 'Double', 'Int32', 'Int64', 'Char'].includes(tk.v)) throw new CsError(`'${tk.v}' should be '${kw}' (C# is case-sensitive)`, tk.line, CASE_MSG(kw), [{ from: tk.v, to: kw, line: tk.line }]);
  }
  return toks;
}
const PREC = [['||'], ['&&'], ['==', '!='], ['<', '>', '<=', '>='], ['+', '-'], ['*', '/', '%']];
function esc(ch) { return ({ n: '\n', t: '\t', '"': '"', "'": "'", '\\': '\\', '0': '\0', r: '' })[ch] ?? ch; }

// ---------------- Parser ----------------
function parse(src) {
  const toks = tokenize(src); let p = 0;
  const peek = (k = 0) => toks[p + k];
  const is = (t, v, k = 0) => { const x = toks[p + k]; return x.t === t && (v === undefined || x.v === v); };
  const isOp = (v, k = 0) => is('op', v, k);
  const next = () => toks[p++];
  const desc = (tk) => tk.t === 'eof' ? 'end of code' : `'${tk.t === 'interp' ? '$"..."' : tk.v}'`;
  function expect(t, v) {
    const x = peek();
    if (x.t !== t || (v !== undefined && x.v !== v)) {
      const want = v || t;
      let he = `ציפיתי ל-'${want}' אבל מצאתי ${desc(x)}`;
      if (v === ';') he = `חסר ; (נקודה-פסיק) בסוף הפקודה`;
      if (v === ')') he = `חסר סוגר ) `;
      if (v === '}') he = `חסר סוגר מסולסל } `;
      const ln = (v === ';' && p > 0) ? toks[p-1].line : x.line;
      throw new CsError(`Expected '${want}' but found ${desc(x)}`, ln, he);
    }
    return next();

</script><script>window.TOPICS=[{"id": "io-variables", "title": "קלט, פלט ומשתנים", "title_en": "Input, Output & Variables", "order": 1, "icon": "⌨️", "intro": "<p><b>פלט (output)</b> – מדפיסים למסך עם <code>Console.WriteLine(...)</code> (מדפיס ויורד שורה) או <code>Console.Write(...)</code> (בלי לרדת שורה).</p>\n<p><b>קלט (input)</b> – קוראים שורה שהמשתמש הקליד עם <code>Console.ReadLine()</code>. התוצאה תמיד <b>string (מחרוזת)</b>.</p>\n<pre>string name = Console.ReadLine();\nConsole.WriteLine(\"Hello, \" + name + \"!\");\nConsole.WriteLine($\"Hello, {name}!\");   // string interpolation</pre>\n<p>כדי לקרוא מספר צריך להמיר (convert / parse): <code>int.Parse(...)</code>, <code>double.Parse(...)</code>, <code>bool.Parse(...)</code>.</p>\n<p>💡 בתרגילים כאן <b>אל תדפיסו הודעות כמו \"הכנס מספר\"</b> – הבודק האוטומטי משווה רק את הפלט שהתבקש.</p><hr><p><b>משתנה (variable)</b> הוא \"קופסה\" עם שם וסוג (type):</p>\n<pre>int age = 12;          // מספר שלם\ndouble price = 19.9;   // מספר עשרוני\nbool isStudent = true; // אמת/שקר\nstring name = \"Dana\";  // טקסט</pre>\n<p>אחרי שהגדרנו משתנה משנים אותו בלי לכתוב שוב את הסוג: <code>age = 13;</code></p>", "intro_en": "<p><b>Output</b> – print with <code>Console.WriteLine(...)</code> (prints and moves to a new line) or <code>Console.Write(...)</code> (stays on the same line).</p>\n<p><b>Input</b> – read a line the user typed with <code>Console.ReadLine()</code>. The result is always a <b>string</b>.</p>\n<pre>string name = Console.ReadLine();\nConsole.WriteLine(\"Hello, \" + name + \"!\");\nConsole.WriteLine($\"Hello, {name}!\");   // string interpolation</pre>\n<p>To read a number you must convert it: <code>int.Parse(...)</code>, <code>double.Parse(...)</code>, <code>bool.Parse(...)</code>.</p>\n<p>💡 In these exercises <b>don't print prompts like \"Enter a number\"</b> – the auto-grader compares only the requested output.</p><hr><p>A <b>variable</b> is a named \"box\" with a type:</p>\n<pre>int age = 12;          // whole number\ndouble price = 19.9;   // decimal number\nbool isStudent = true; // true/false\nstring name = \"Dana\";  // text</pre>\n<p>After declaring a variable, change it without repeating the type: <code>age = 13;</code></p>", "exercises": [{"id": "io-variables-01", "level": "קל", "title": "Hello World", "statement": "הדפיסו בדיוק: <code>Hello World</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "", "output": "Hello World\n", "sample": true}, {"input": "", "output": "Hello World\n", "sample": false}, {"input": "", "output": "Hello World\n", "sample": false}], "hints": ["כדי להדפיס משהו למסך משתמשים ב-Console.WriteLine – זו הפקודה שכותבת שורה לקונסולה.", "טקסט קבוע כותבים בתוך מירכאות \"...\" – כך C# יודע שזה טקסט ולא שם של משתנה.", "כמעט התשובה: Console.WriteLine(\"Hello World\"); – שימו לב לאותיות גדולות ול-; בסוף, כי כל פקודה ב-C# נגמרת בנקודה-פסיק."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine(\"Hello World\");\n    }\n}\n", "explanation": "`Console.WriteLine(\"Hello World\");` – מדפיסה את הטקסט שבין המירכאות ויורדת שורה.\nהנקודה-פסיק `;` מסיימת כל פקודה ב-C#."}, {"id": "io-variables-02", "level": "קל", "title": "שתי שורות", "statement": "הדפיסו בשתי שורות נפרדות: <code>I love</code> ואחריה <code>C#</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "", "output": "I love\nC#\n", "sample": true}, {"input": "", "output": "I love\nC#\n", "sample": false}, {"input": "", "output": "I love\nC#\n", "sample": false}], "hints": ["צריך שתי שורות פלט – חשבו כמה פקודות הדפסה צריך.", "כל Console.WriteLine מדפיס שורה אחת ויורד שורה בסופה, ולכן שתי פקודות = שתי שורות.", "כמעט התשובה: Console.WriteLine(\"I love\"); ואחריה Console.WriteLine(\"C#\"); – הסדר חשוב כי התוכנית רצה מלמעלה למטה."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine(\"I love\");\n        Console.WriteLine(\"C#\");\n    }\n}\n", "explanation": "כל `Console.WriteLine` מדפיסה שורה אחת ויורדת שורה.\nלכן שתי פקודות = שתי שורות על המסך."}, {"id": "io-variables-03", "level": "קל", "title": "שלום לך", "statement": "קראו שם (string) מהמשתמש והדפיסו <code>Hello, NAME!</code><br>לדוגמה: קלט <code>Dana</code> → <code>Hello, Dana!</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "Dana\n", "output": "Hello, Dana!\n", "sample": true}, {"input": "Yahali\n", "output": "Hello, Yahali!\n", "sample": false}, {"input": "Bob\n", "output": "Hello, Bob!\n", "sample": false}], "hints": ["קודם צריך לקבל את השם מהמשתמש ולשמור אותו, כי נשתמש בו בהדפסה.", "Console.ReadLine() קורא שורה ומחזיר string, ולכן: string name = Console.ReadLine();", "כמעט התשובה: \"Hello, \" + name + \"!\" – החיבור + מדביק מחרוזות, ושימו לב לרווח אחרי הפסיק."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string name = Console.ReadLine();\n        Console.WriteLine(\"Hello, \" + name + \"!\");\n    }\n}\n", "explanation": "`string name = Console.ReadLine();` – קוראת את מה שהמשתמש הקליד לתוך משתנה מסוג string.\n`\"Hello, \" + name + \"!\"` – שרשור (concatenation): מחברים טקסטים עם `+`."}, {"id": "io-variables-04", "level": "קל", "title": "שם וגיל", "statement": "קראו שם ואחריו גיל (שתי שורות קלט). הדפיסו <code>NAME is AGE years old</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "Dana\n12\n", "output": "Dana is 12 years old\n", "sample": true}, {"input": "Noam\n9\n", "output": "Noam is 9 years old\n", "sample": false}, {"input": "Yahali\n100\n", "output": "Yahali is 100 years old\n", "sample": false}], "hints": ["יש שתי שורות קלט – כל ReadLine קורא שורה אחת בלבד.", "צריך שני משתנים (name ו-age); את הגיל לא חייבים להמיר למספר כי רק מדפיסים אותו ולא מחשבים איתו.", "כמעט התשובה: Console.WriteLine($\"{name} is {age} years old\"); – עם $ אפשר לשים משתנים בתוך {} ישירות בטקסט."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string name = Console.ReadLine();\n        string age = Console.ReadLine();\n        Console.WriteLine($\"{name} is {age} years old\");\n    }\n}\n", "explanation": "שתי קריאות `Console.ReadLine()` – אחת לכל שורת קלט, לפי הסדר.\nהגיל נשאר string כי רק מדפיסים אותו – לא צריך Parse.\n`$\"{name} is {age} years old\"` – אינטרפולציה: המשתנים בתוך `{ }` מוחלפים בערכים שלהם."}, {"id": "io-variables-05", "level": "קל", "title": "שלוש פעמים", "statement": "קראו מילה והדפיסו אותה 3 פעמים, כל פעם בשורה נפרדת.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "wow\n", "output": "wow\nwow\nwow\n", "sample": true}, {"input": "C#\n", "output": "C#\nC#\nC#\n", "sample": false}, {"input": "hello world\n", "output": "hello world\nhello world\nhello world\n", "sample": false}], "hints": ["אם נקרא ReadLine שלוש פעמים נחכה לשלוש מילים – אבל יש רק אחת.", "שומרים את המילה פעם אחת במשתנה, ואז משתמשים במשתנה כמה פעמים שרוצים – בשביל זה יש משתנים.", "כמעט התשובה: string w = Console.ReadLine(); ואחריה שלוש פעמים Console.WriteLine(w);"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string w = Console.ReadLine();\n        Console.WriteLine(w);\n        Console.WriteLine(w);\n        Console.WriteLine(w);\n    }\n}\n", "explanation": "שומרים את המילה במשתנה `w` פעם אחת.\nמשתמשים במשתנה שלוש פעמים – אין צורך לקרוא קלט שוב."}, {"id": "io-variables-06", "level": "בינוני", "title": "Write מול WriteLine", "statement": "קראו שתי מילים (בשתי שורות) והדפיסו אותן <b>באותה שורה</b> עם רווח ביניהן. השתמשו ב-<code>Console.Write</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "good\nmorning\n", "output": "good morning\n", "sample": true}, {"input": "a\nb\n", "output": "a b\n", "sample": false}, {"input": "C#\nrocks\n", "output": "C# rocks\n", "sample": false}], "hints": ["WriteLine תמיד יורד שורה בסוף – וכאן אנחנו רוצים להישאר באותה שורה.", "Console.Write מדפיס בלי לרדת שורה, ולכן ההדפסה הבאה תמשיך מאותו מקום.", "כמעט התשובה: Console.Write(a); Console.Write(\" \"); Console.WriteLine(b); – את הרווח צריך להדפיס בעצמנו, והאחרון ב-WriteLine כדי לסיים שורה."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string a = Console.ReadLine();\n        string b = Console.ReadLine();\n        Console.Write(a);\n        Console.Write(\" \");\n        Console.WriteLine(b);\n    }\n}\n", "explanation": "`Console.Write(a);` מדפיסה בלי לרדת שורה.\n`Console.Write(\" \");` מוסיפה רווח באותה שורה.\n`Console.WriteLine(b);` מדפיסה את המילה השנייה ומסיימת את השורה."}, {"id": "io-variables-07", "level": "בינוני", "title": "הבא והקודם", "statement": "קראו מספר שלם n. הדפיסו <code>Next: n+1</code> ובשורה הבאה <code>Previous: n-1</code><br>לדוגמה 7 → <code>Next: 8</code> , <code>Previous: 6</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "7\n", "output": "Next: 8\nPrevious: 6\n", "sample": true}, {"input": "0\n", "output": "Next: 1\nPrevious: -1\n", "sample": false}, {"input": "-5\n", "output": "Next: -4\nPrevious: -6\n", "sample": false}, {"input": "100\n", "output": "Next: 101\nPrevious: 99\n", "sample": false}], "hints": ["הקלט מגיע כטקסט, וצריך מספר כדי לעשות חשבון.", "int.Parse ממיר טקסט למספר שלם: int n = int.Parse(Console.ReadLine());", "כמעט התשובה: \"Next: \" + (n + 1) – בלי סוגריים C# ידביק קודם את n לטקסט ואז את 1, ותקבלו 71 במקום 8."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        Console.WriteLine(\"Next: \" + (n + 1));\n        Console.WriteLine(\"Previous: \" + (n - 1));\n    }\n}\n", "explanation": "`int.Parse(Console.ReadLine())` – הופכת את הטקסט למספר שלם (int).\n`\"Next: \" + (n + 1)` – הסוגריים חשובים! בלעדיהם C# היה מדביק \"1\" כטקסט אחרי n."}, {"id": "io-variables-08", "level": "בינוני", "title": "שם משפחה קודם", "statement": "קראו שם פרטי ואז שם משפחה. הדפיסו <code>LAST, FIRST</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "Dana\nLevi\n", "output": "Levi, Dana\n", "sample": true}, {"input": "Harry\nPotter\n", "output": "Potter, Harry\n", "sample": false}, {"input": "Lionel\nMessi\n", "output": "Messi, Lionel\n", "sample": false}], "hints": ["יש שני שמות לקרוא – צריך שני משתנים מסוג string.", "קוראים בסדר: קודם first ואז last, כי זה סדר הקלט.", "כמעט התשובה: Console.WriteLine(last + \", \" + first); – ההדפסה בסדר הפוך מהקריאה, עם פסיק ורווח באמצע."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string first = Console.ReadLine();\n        string last = Console.ReadLine();\n        Console.WriteLine(last + \", \" + first);\n    }\n}\n", "explanation": "קוראים קודם שם פרטי ואז שם משפחה – לפי סדר הקלט.\nבהדפסה הסדר הפוך: `last + \", \" + first`."}, {"id": "io-variables-09", "level": "בינוני", "title": "מחיר עשרוני", "statement": "קראו מחיר (double) והדפיסו <code>Price: X</code> ובשורה הבאה את המחיר כפול 2: <code>Double: Y</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "12.5\n", "output": "Price: 12.5\nDouble: 25\n", "sample": true}, {"input": "3\n", "output": "Price: 3\nDouble: 6\n", "sample": false}, {"input": "0.25\n", "output": "Price: 0.25\nDouble: 0.5\n", "sample": false}], "hints": ["מחיר יכול להיות עם נקודה עשרונית, ולכן int לא מתאים כאן.", "double.Parse ממיר טקסט למספר עשרוני: double price = double.Parse(Console.ReadLine());", "כמעט התשובה: \"Double: \" + price * 2 – כפל מתבצע לפני החיבור, ולכן כאן אפשר גם בלי סוגריים."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        double price = double.Parse(Console.ReadLine());\n        Console.WriteLine(\"Price: \" + price);\n        Console.WriteLine(\"Double: \" + price * 2);\n    }\n}\n", "explanation": "`double.Parse` – ממירה טקסט למספר עשרוני (double).\n`price * 2` – כפל קודם לחיבור, ולכן מתבצע לפני השרשור.\nC# מדפיס double בלי אפסים מיותרים: 3 ולא 3.0."}, {"id": "io-variables-10", "level": "בינוני", "title": "בוליאני", "statement": "קראו ערך בוליאני (bool) – <code>true</code> או <code>false</code> – שאומר אם המשתמש תלמיד. הדפיסו <code>Student: True</code> או <code>Student: False</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "true\n", "output": "Student: True\n", "sample": true}, {"input": "false\n", "output": "Student: False\n", "sample": false}, {"input": "true\n", "output": "Student: True\n", "sample": false}], "hints": ["true/false הם ערכים מסוג bool – וגם אותם צריך להמיר מטקסט.", "bool.Parse ממיר את הטקסט \"true\" או \"false\" לערך bool: bool isStudent = bool.Parse(Console.ReadLine());", "כמעט התשובה: \"Student: \" + isStudent – כשמדפיסים bool, C# כותב אותו עם אות גדולה (True/False), וזה בדיוק מה שצריך."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        bool isStudent = bool.Parse(Console.ReadLine());\n        Console.WriteLine(\"Student: \" + isStudent);\n    }\n}\n", "explanation": "`bool.Parse` – הופכת את הטקסט \"true\"/\"false\" לערך בוליאני.\nכשמדפיסים bool, C# כותב `True` או `False` עם אות גדולה."}, {"id": "io-variables-11", "level": "מבחן", "title": "אורך מילה", "statement": "קראו מילה. הדפיסו אותה בתוך סוגריים מרובעים, למשל <code>[cat]</code>, ובשורה הבאה <code>Length: 3</code> (מספר התווים). רמז: <code>word.Length</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "cat\n", "output": "[cat]\nLength: 3\n", "sample": true}, {"input": "programming\n", "output": "[programming]\nLength: 11\n", "sample": false}, {"input": "a\n", "output": "[a]\nLength: 1\n", "sample": false}], "hints": ["יש שתי שורות פלט: המילה בסוגריים, ואחריה האורך.", "לכל string יש תכונה Length שמחזירה את מספר התווים – word.Length (בלי סוגריים, כי זו תכונה ולא פעולה).", "כמעט התשובה: Console.WriteLine(\"[\" + word + \"]\"); ואחריה Console.WriteLine(\"Length: \" + word.Length);"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string word = Console.ReadLine();\n        Console.WriteLine(\"[\" + word + \"]\");\n        Console.WriteLine(\"Length: \" + word.Length);\n    }\n}\n", "explanation": "`\"[\" + word + \"]\"` – שרשור עם סוגריים מרובעים.\n`word.Length` – מספר התווים במחרוזת (שימו לב: Length בלי סוגריים, כי זו תכונה ולא פעולה)."}, {"id": "io-variables-12", "level": "מבחן", "title": "סדר הפוך", "statement": "קראו 3 שורות והדפיסו אותן בסדר הפוך (האחרונה ראשונה).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "one\ntwo\nthree\n", "output": "three\ntwo\none\n", "sample": true}, {"input": "x\ny\nz\n", "output": "z\ny\nx\n", "sample": false}, {"input": "1\n2\n3\n", "output": "3\n2\n1\n", "sample": false}], "hints": ["אי אפשר להדפיס את השורה האחרונה לפני שקראנו אותה – אז מה צריך לעשות קודם?", "קוראים את שלוש השורות לשלושה משתנים (a, b, c) – כך כולן שמורות לפני ההדפסה.", "כמעט התשובה: מדפיסים c, אחר כך b ובסוף a – כל אחד ב-WriteLine משלו."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string a = Console.ReadLine();\n        string b = Console.ReadLine();\n        string c = Console.ReadLine();\n        Console.WriteLine(c);\n        Console.WriteLine(b);\n        Console.WriteLine(a);\n    }\n}\n", "explanation": "צריך לקרוא את שלוש השורות לפני שמדפיסים, אחרת לא נדע מה האחרונה.\nשלושה משתנים `a, b, c`, ואז מדפיסים `c`, `b`, `a`."}]}, {"id": "arithmetic", "title": "חשבון ואחוזים", "order": 2, "intro": "ב-C# חילוק של שני int נותן רק את החלק השלם: 17 / 5 שווה 3. האופרטור % נותן את השארית: 17 % 5 שווה 2.\nטריק חשוב במבחנים: n % 10 נותן את הספרה האחרונה של מספר, ו-n / 10 מוחק אותה.\nכדי לקבל תוצאה עשרונית, צריך שאחד המספרים יהיה double: (double)17 / 5 שווה 3.4.\nאחוזים: 30% מ-80 זה 80 * 30 / 100. ו-Math.Min(x, 100) דואג שמספר לא יעבור את 100.\n\nדוגמה:\nint n = int.Parse(Console.ReadLine()); // 472\nConsole.WriteLine(n % 10);  // 2\nConsole.WriteLine(n / 10);  // 47", "exercises": [{"id": "arith-01", "level": "קל", "title": "שעות ודקות", "statement": "קלטו מספר שלם של דקות (למשל משך סרט). הדפיסו בשורה הראשונה כמה שעות שלמות יש בו, ובשורה השנייה כמה דקות נשארות.\nדוגמה: עבור 135 יודפס 2 ואז 15.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "135\n", "output": "2\n15\n", "sample": true}, {"input": "59\n", "output": "0\n59\n", "sample": false}, {"input": "120\n", "output": "2\n0\n", "sample": false}, {"input": "61\n", "output": "1\n1\n", "sample": false}], "hints": ["בשעה יש 60 דקות. חלוקה של int ב-int נותנת רק את החלק השלם: 135 / 60 שווה 2.", "השארית מתקבלת עם %: ‏135 % 60 שווה 15."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int minutes = int.Parse(Console.ReadLine());\n        Console.WriteLine(minutes / 60);\n        Console.WriteLine(minutes % 60);\n    }\n}\n", "explanation": "int.Parse(Console.ReadLine()) קורא את מספר הדקות ושומר אותו ב-minutes.\nminutes / 60 הוא חילוק שלם: כמה שעות שלמות יש (השארית נזרקת).\nminutes % 60 נותן את השארית: כמה דקות נשארו אחרי השעות השלמות."}, {"id": "arith-02", "level": "קל", "title": "הספרה האחרונה", "statement": "קלטו מספר שלם חיובי. הדפיסו בשורה הראשונה את ספרת האחדות שלו, ובשורה השנייה את המספר בלי ספרת האחדות.\nדוגמה: עבור 4827 יודפס 7 ואז 482.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "4827\n", "output": "7\n482\n", "sample": true}, {"input": "50\n", "output": "0\n5\n", "sample": false}, {"input": "9\n", "output": "9\n0\n", "sample": false}, {"input": "1001\n", "output": "1\n100\n", "sample": false}], "hints": ["n % 10 נותן את הספרה האחרונה.", "n / 10 \"מוחק\" את הספרה האחרונה."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        Console.WriteLine(n % 10);\n        Console.WriteLine(n / 10);\n    }\n}\n", "explanation": "קוראים את המספר ושומרים אותו ב-n.\nn % 10 נותן את השארית בחילוק ב-10, וזו בדיוק הספרה האחרונה.\nn / 10 הוא חילוק שלם שמוריד את הספרה האחרונה."}, {"id": "arith-03", "level": "קל", "title": "חילוק שלם מול חילוק עשרוני", "statement": "קלטו שני מספרים שלמים a ו-b (b אינו 0). הדפיסו בשורה הראשונה את תוצאת החילוק a / b כשני מספרים שלמים (int), ובשורה השנייה את תוצאת החילוק המדויקת כ-double, מעוגלת ל-2 ספרות אחרי הנקודה בעזרת Math.Round(x, 2).\nדוגמה: עבור 7 ו-2 יודפס 3 ואז 3.5.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "7\n2\n", "output": "3\n3.5\n", "sample": true}, {"input": "10\n3\n", "output": "3\n3.33\n", "sample": false}, {"input": "8\n4\n", "output": "2\n2\n", "sample": false}, {"input": "2\n3\n", "output": "0\n0.67\n", "sample": false}], "hints": ["כדי לקבל חילוק עשרוני, הפכו אחד המספרים ל-double: (double)a / b.", "Console.WriteLine של 2.0 מדפיס 2, ושל 3.50 מדפיס 3.5, וזה בסדר."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        Console.WriteLine(a / b);\n        Console.WriteLine(Math.Round((double)a / b, 2));\n    }\n}\n", "explanation": "קוראים שני מספרים שלמים, a ו-b.\na / b בין שני int נותן חילוק שלם, בלי חלק עשרוני.\n(double)a הופך את a למספר עשרוני, ואז החילוק כבר עשרוני.\nMath.Round(..., 2) מעגל את התוצאה ל-2 ספרות אחרי הנקודה."}, {"id": "arith-04", "level": "קל", "title": "מבצע בחנות", "statement": "בחנות יש הנחה. קלטו את מחיר המוצר בשקלים (מספר שלם) ואת אחוז ההנחה (מספר שלם). הדפיסו את המחיר אחרי ההנחה כמספר שלם (מעגלים כלפי מטה, כלומר מחשבים בחילוק שלם).\nדוגמה: מחיר 200 והנחה 15 – יודפס 170.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "200\n15\n", "output": "170\n", "sample": true}, {"input": "99\n10\n", "output": "89\n", "sample": false}, {"input": "50\n0\n", "output": "50\n", "sample": false}, {"input": "80\n100\n", "output": "0\n", "sample": false}], "hints": ["אחרי הנחה של p אחוזים משלמים (100 - p) אחוזים מהמחיר.", "קודם כופלים ורק אחר כך מחלקים: price * (100 - p) / 100."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int price = int.Parse(Console.ReadLine());\n        int p = int.Parse(Console.ReadLine());\n        Console.WriteLine(price * (100 - p) / 100);\n    }\n}\n", "explanation": "קוראים את המחיר (price) ואת אחוז ההנחה (p).\n100 - p הוא האחוז שנשאר לשלם.\nקודם כופלים ב-price ורק אחר כך מחלקים ב-100, כדי שהחילוק השלם לא יאבד דיוק."}, {"id": "arith-05", "level": "בינוני", "title": "סכום ספרות", "statement": "קלטו מספר תלת-ספרתי (בין 100 ל-999). הדפיסו את סכום הספרות שלו.\nדוגמה: עבור 472 יודפס 13.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "472\n", "output": "13\n", "sample": true}, {"input": "100\n", "output": "1\n", "sample": false}, {"input": "999\n", "output": "27\n", "sample": false}, {"input": "305\n", "output": "8\n", "sample": false}], "hints": ["פרקו את המספר לשלוש ספרות נפרדות, כל אחת במשתנה משלה, ורק אז חברו אותן.", "ספרת האחדות: n % 10. ספרת העשרות: (n / 10) % 10. ספרת המאות: n / 100."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int ones = n % 10;\n        int tens = (n / 10) % 10;\n        int hundreds = n / 100;\n        Console.WriteLine(ones + tens + hundreds);\n    }\n}\n", "explanation": "קוראים מספר תלת-ספרתי ל-n.\nn % 10 נותן את ספרת האחדות (ones).\n(n / 10) % 10 מוריד ספרה אחת ואז לוקח את האחרונה, וזו ספרת העשרות (tens).\nn / 100 נותן את ספרת המאות (hundreds).\nבסוף מחברים את שלוש הספרות ומדפיסים."}, {"id": "arith-06", "level": "בינוני", "title": "ציון משוקלל", "statement": "הציון הסופי במקצוע מורכב מ-70% ציון מבחן ו-30% ציון עבודה. קלטו ציון מבחן וציון עבודה (מספרים שלמים בין 0 ל-100). הדפיסו את הציון הסופי מעוגל למספר השלם הקרוב (חצי מעגלים למעלה, למשל 84.5 הופך ל-85).\nדוגמה: מבחן 80 ועבודה 95 – יודפס 85 (כי 56 + 28.5 = 84.5).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "80\n95\n", "output": "85\n", "sample": true}, {"input": "100\n100\n", "output": "100\n", "sample": false}, {"input": "71\n60\n", "output": "68\n", "sample": false}, {"input": "55\n0\n", "output": "39\n", "sample": false}, {"input": "90\n81\n", "output": "87\n", "sample": false}], "hints": ["אפשר להישאר עם מספרים שלמים: 70 * exam + 30 * project נותן את הציון כפול 100.", "כדי לעגל חצי למעלה בחילוק שלם, מוסיפים 50 לפני החילוק ב-100."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int exam = int.Parse(Console.ReadLine());\n        int project = int.Parse(Console.ReadLine());\n        int finalGrade = (70 * exam + 30 * project + 50) / 100;\n        Console.WriteLine(finalGrade);\n    }\n}\n", "explanation": "קוראים את ציון המבחן (exam) וציון הפרויקט (project).\n70 * exam + 30 * project נותן את הציון המשוקלל כפול 100.\nמוסיפים 50 לפני החילוק ב-100, וכך הציון מתעגל לשלם הקרוב במקום להיחתך."}, {"id": "arith-07", "level": "בינוני", "title": "בונוס עד 100", "statement": "המורה נותנת בונוס לכל התלמידים, אבל ציון לא יכול להיות יותר מ-100. קלטו ציון ובונוס (מספרים שלמים) והדפיסו את הציון החדש. אסור להשתמש ב-if – השתמשו ב-Math.Min.\nדוגמה: ציון 92 ובונוס 5 – יודפס 97. ציון 98 ובונוס 5 – יודפס 100.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "92\n5\n", "output": "97\n", "sample": true}, {"input": "98\n5\n", "output": "100\n", "sample": true}, {"input": "100\n10\n", "output": "100\n", "sample": false}, {"input": "40\n0\n", "output": "40\n", "sample": false}], "hints": ["Math.Min(x, y) מחזיר את הקטן מבין שני המספרים.", "אם grade + bonus יוצא יותר מ-100, הפקודה Math.Min(grade + bonus, 100) תחזיר 100. אחרת היא תחזיר את הסכום עצמו."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int grade = int.Parse(Console.ReadLine());\n        int bonus = int.Parse(Console.ReadLine());\n        Console.WriteLine(Math.Min(grade + bonus, 100));\n    }\n}\n", "explanation": "קוראים את הציון (grade) ואת הבונוס (bonus).\ngrade + bonus הוא הציון אחרי הבונוס.\nMath.Min(..., 100) בוחר את הקטן מבין השניים, כך שהציון אף פעם לא עובר את 100."}, {"id": "arith-08", "level": "בינוני", "title": "הפוך את המספר", "statement": "קלטו מספר תלת-ספרתי (בין 100 ל-999). הדפיסו את המספר בסדר ספרות הפוך, כמספר.\nדוגמה: עבור 123 יודפס 321. עבור 120 יודפס 21 (כי 021 הוא בעצם 21).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "123\n", "output": "321\n", "sample": true}, {"input": "120\n", "output": "21\n", "sample": true}, {"input": "707\n", "output": "707\n", "sample": false}, {"input": "100\n", "output": "1\n", "sample": false}], "hints": ["פרקו את המספר לשלוש ספרות (אחדות, עשרות, מאות) כמו בתרגיל סכום הספרות.", "בנו מספר חדש: ones * 100 + tens * 10 + hundreds."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int ones = n % 10;\n        int tens = (n / 10) % 10;\n        int hundreds = n / 100;\n        Console.WriteLine(ones * 100 + tens * 10 + hundreds);\n    }\n}\n", "explanation": "מפרקים את n לשלוש ספרות: ones עם % 10, tens עם (n / 10) % 10, ו-hundreds עם n / 100.\nבונים מספר חדש בסדר הפוך: האחדות הופכות למאות (כפול 100), העשרות נשארות עשרות (כפול 10), והמאות הופכות לאחדות."}, {"id": "arith-09", "level": "מבחן", "title": "ספרת ביקורת", "statement": "לכל מוצר בחנות יש קוד תלת-ספרתי. כדי לזהות טעויות הקלדה מוסיפים לקוד ספרת ביקורת בסופו: ספרת הביקורת היא ספרת האחדות של סכום שלוש הספרות.\nכתבו תוכנית שקולטת קוד תלת-ספרתי ומדפיסה בשורה הראשונה את ספרת הביקורת, ובשורה השנייה את הקוד המלא בן 4 הספרות (הקוד המקורי ואחריו ספרת הביקורת).\nדוגמה: עבור 538 – סכום הספרות 16, ספרת הביקורת 6, יודפס 6 ואז 5386.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "538\n", "output": "6\n5386\n", "sample": true}, {"input": "100\n", "output": "1\n1001\n", "sample": false}, {"input": "999\n", "output": "7\n9997\n", "sample": false}, {"input": "455\n", "output": "4\n4554\n", "sample": false}], "hints": ["קודם חשבו את סכום הספרות, ואז sum % 10.", "כדי \"להדביק\" ספרה בסוף מספר: code * 10 + digit."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int code = int.Parse(Console.ReadLine());\n        int sum = code % 10 + (code / 10) % 10 + code / 100;\n        int check = sum % 10;\n        Console.WriteLine(check);\n        Console.WriteLine(code * 10 + check);\n    }\n}\n", "explanation": "sum הוא סכום שלוש הספרות של code (אחדות, עשרות ומאות).\nsum % 10 נותן את הספרה האחרונה של הסכום, וזו ספרת הביקורת check.\ncode * 10 מזיז את הקוד מקום אחד שמאלה ומשאיר מקום ריק בסוף, ו-+ check מכניס לשם את ספרת הביקורת."}, {"id": "arith-10", "level": "מבחן", "title": "שעון עצר", "statement": "שעון עצר בתחרות ריצה מודד את הזמן בשניות. קלטו מספר שלם של שניות והדפיסו בשורה אחת את מספר השעות, הדקות והשניות, מופרדים ברווח אחד.\nדוגמה: עבור 3725 יודפס 1 2 5 (שעה אחת, 2 דקות ו-5 שניות).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3725\n", "output": "1 2 5\n", "sample": true}, {"input": "59\n", "output": "0 0 59\n", "sample": false}, {"input": "3600\n", "output": "1 0 0\n", "sample": false}, {"input": "86399\n", "output": "23 59 59\n", "sample": false}], "hints": ["בשעה יש 3600 שניות (60 דקות כפול 60 שניות), ולכן מספר השעות הוא seconds / 3600.", "הדקות: (seconds % 3600) / 60. השניות: seconds % 60.", "אפשר להדפיס כך: Console.WriteLine(h + \" \" + m + \" \" + s);"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int total = int.Parse(Console.ReadLine());\n        int h = total / 3600;\n        int m = (total % 3600) / 60;\n        int s = total % 60;\n        Console.WriteLine(h + \" \" + m + \" \" + s);\n    }\n}\n", "explanation": "קוראים את מספר השניות ל-total.\ntotal / 3600 נותן את השעות השלמות, כי בשעה יש 3600 שניות.\n(total % 3600) / 60 לוקח את מה שנשאר אחרי השעות ומחשב ממנו דקות.\ntotal % 60 נותן את השניות שנשארו.\nמדפיסים את שלושתם בשורה אחת עם רווחים ביניהם."}, {"id": "arith-11", "level": "מבחן", "title": "אחוז עוברים", "statement": "בכיתה נבחנו כמה תלמידים במבחן. קלטו את מספר התלמידים שנבחנו ואת מספר התלמידים שעברו. הדפיסו בשורה הראשונה את מספר התלמידים שנכשלו, ובשורה השנייה את אחוז העוברים כמספר שלם (מעגלים כלפי מטה).\nדוגמה: נבחנו 30 ועברו 25 – יודפס 5 ואז 83 (כי 83.33%).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "30\n25\n", "output": "5\n83\n", "sample": true}, {"input": "20\n20\n", "output": "0\n100\n", "sample": false}, {"input": "7\n2\n", "output": "5\n28\n", "sample": false}, {"input": "40\n10\n", "output": "30\n25\n", "sample": false}], "hints": ["אחוז = חלק * 100 / שלם.", "כפלו ב-100 לפני החילוק, אחרת 25 / 30 בחילוק שלם ייתן 0."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int total = int.Parse(Console.ReadLine());\n        int passed = int.Parse(Console.ReadLine());\n        Console.WriteLine(total - passed);\n        Console.WriteLine(passed * 100 / total);\n    }\n}\n", "explanation": "קוראים את מספר התלמידים (total) ואת מספר העוברים (passed).\ntotal - passed הוא מספר הנכשלים.\npassed * 100 / total נותן את אחוז העוברים. כופלים ב-100 קודם, אחרת החילוק השלם ייתן 0."}, {"id": "arith-12", "level": "מבחן", "title": "הציון הסופי בתעודה", "statement": "הציון בתעודה מחושב כך: 70% ציון מבחן ועוד 30% ציון עבודה, מעוגל למספר שלם (חצי מעגלים למעלה). אחר כך מוסיפים בונוס השתתפות, אבל הציון בתעודה לא יכול לעלות על 100.\nקלטו שלוש שורות: ציון מבחן, ציון עבודה (מספרים שלמים בין 0 ל-100) ובונוס (מספר עשרוני, למשל 2.5). הבונוס נוסף לציון המעוגל ואז מעגלים שוב כלפי מטה למספר שלם.\nהדפיסו בשורה הראשונה את הציון המשוקלל לפני הבונוס, ובשורה השנייה את הציון בתעודה.\nדוגמה: מבחן 80, עבודה 95, בונוס 2.5 – הציון המשוקלל 85, ועם הבונוס 87.5, כלומר יודפס 85 ואז 87.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "80\n95\n2.5\n", "output": "85\n87\n", "sample": true}, {"input": "98\n100\n5\n", "output": "99\n100\n", "sample": false}, {"input": "60\n70\n0\n", "output": "63\n63\n", "sample": false}, {"input": "71\n60\n3.9\n", "output": "68\n71\n", "sample": false}], "hints": ["הבונוס יכול להיות מספר עשרוני כמו 2.5, ולכן קוראים אותו עם double.Parse ולא עם int.Parse.", "(int) על double חיובי חותך את החלק העשרוני, כלומר מעגל כלפי מטה.", "Math.Min(…, 100) שומר שהציון לא יעבור את 100."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int exam = int.Parse(Console.ReadLine());\n        int project = int.Parse(Console.ReadLine());\n        double bonus = double.Parse(Console.ReadLine());\n        int weighted = (70 * exam + 30 * project + 50) / 100;\n        int final = (int)(weighted + bonus);\n        final = Math.Min(final, 100);\n        Console.WriteLine(weighted);\n        Console.WriteLine(final);\n    }\n}\n", "explanation": "קוראים שני ציונים שלמים ובונוס עשרוני (double.Parse).\nweighted הוא הציון המשוקלל 70/30, עם + 50 כדי לעגל לשלם הקרוב.\n(int)(weighted + bonus) מוסיף את הבונוס וחותך את החלק העשרוני.\nMath.Min(final, 100) דואג שהציון לא יעבור את 100.\nבסוף מדפיסים את הציון המשוקלל ואת הציון הסופי."}]}, {"id": "conditions", "title": "תנאים", "title_en": "Conditions (if, else, && ||)", "order": 3, "icon": "🔀", "intro": "<p><b>תנאי (condition)</b> מאפשר לתוכנית לבחור מה לעשות:</p>\n<pre>if (grade >= 55)\n{\n    Console.WriteLine(\"pass\");\n}\nelse if (grade >= 45)\n{\n    Console.WriteLine(\"second chance\");\n}\nelse\n{\n    Console.WriteLine(\"fail\");\n}</pre>\n<p>אופרטורי השוואה (comparison): <code>== != &lt; &gt; &lt;= &gt;=</code>. שימו לב: <code>=</code> זה השמה (assignment), <code>==</code> זה השוואה!</p>\n<p>ב-<code>else if</code> נבדק רק אם התנאים הקודמים נכשלו – לכן הסדר חשוב.</p><hr><p>מחברים תנאים עם אופרטורים לוגיים (logical operators):</p>\n<ul><li><code>&&</code> – וגם (AND): שני התנאים חייבים להתקיים</li><li><code>||</code> – או (OR): מספיק שאחד מתקיים</li><li><code>!</code> – לא (NOT)</li></ul>\n<pre>if (grade >= 30 && grade <= 100)   // בדיקת טווח (range check)\nif (age < 18 || age >= 65)         // מחוץ לטווח\nif (grade >= 45 && grade < 55 && attendance >= 80)</pre>\n<p>טעות נפוצה: <code>30 <= grade <= 100</code> לא עובד ב-C#! צריך שני תנאים עם &&.</p>", "intro_en": "<p>A <b>condition</b> lets the program choose what to do:</p>\n<pre>if (grade >= 55)\n{\n    Console.WriteLine(\"pass\");\n}\nelse if (grade >= 45)\n{\n    Console.WriteLine(\"second chance\");\n}\nelse\n{\n    Console.WriteLine(\"fail\");\n}</pre>\n<p>Comparison operators: <code>== != &lt; &gt; &lt;= &gt;=</code>. Note: <code>=</code> is assignment, <code>==</code> is comparison!</p>\n<p>An <code>else if</code> is checked only when all previous conditions failed – so order matters.</p><hr><p>Combine conditions with <b>logical operators</b>:</p>\n<ul><li><code>&&</code> – AND: both must be true</li><li><code>||</code> – OR: at least one is true</li><li><code>!</code> – NOT</li></ul>\n<pre>if (grade >= 30 && grade <= 100)   // range check\nif (age < 18 || age >= 65)         // outside a range\nif (grade >= 45 && grade < 55 && attendance >= 80)</pre>\n<p>Common mistake: <code>30 <= grade <= 100</code> doesn't work in C#! Use two conditions joined with &&.</p>", "exercises": [{"id": "conditions-01", "level": "קל", "title": "עבר או נכשל", "statement": "קראו ציון. אם הוא 55 ומעלה הדפיסו <code>pass</code>, אחרת <code>fail</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "55\n", "output": "pass\n", "sample": true}, {"input": "54\n", "output": "fail\n", "sample": false}, {"input": "100\n", "output": "pass\n", "sample": false}, {"input": "0\n", "output": "fail\n", "sample": false}], "hints": ["יש שתי אפשרויות פלט – זה המקום ל-if ו-else.", "קודם ממירים את הציון למספר עם int.Parse, כי רק מספרים אפשר להשוות עם > ו-<.", "כמעט התשובה: if (grade >= 55) מדפיסים pass, else מדפיסים fail – משתמשים ב->= כי 55 עצמו עובר."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int grade = int.Parse(Console.ReadLine());\n        if (grade >= 55)\n            Console.WriteLine(\"pass\");\n        else\n            Console.WriteLine(\"fail\");\n    }\n}\n", "explanation": "`int grade = int.Parse(...)` – קוראים את הציון כמספר.\n`if (grade >= 55)` – התנאי: 55 ומעלה (55 עצמו כלול, לכן `>=`).\n`else` – כל מקרה אחר."}, {"id": "conditions-02", "level": "קל", "title": "זוגי או אי-זוגי", "statement": "קראו מספר שלם והדפיסו <code>even</code> אם הוא זוגי, אחרת <code>odd</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "4\n", "output": "even\n", "sample": true}, {"input": "7\n", "output": "odd\n", "sample": false}, {"input": "0\n", "output": "even\n", "sample": false}, {"input": "-3\n", "output": "odd\n", "sample": false}], "hints": ["מספר זוגי מתחלק ב-2 בלי שארית – איזה אופרטור נותן שארית?", "האופרטור % מחזיר את השארית: 7 % 2 הוא 1, ו-4 % 2 הוא 0.", "כמעט התשובה: if (n % 2 == 0) → even, אחרת odd. בודקים == 0 ולא == 1, כי במספר שלילי -3 % 2 יוצא -1."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (n % 2 == 0)\n            Console.WriteLine(\"even\");\n        else\n            Console.WriteLine(\"odd\");\n    }\n}\n", "explanation": "`n % 2` – השארית בחלוקה ב-2.\nאם השארית 0 המספר זוגי. בודקים `== 0` ולא `== 1`, כי למספר שלילי אי-זוגי השארית היא -1."}, {"id": "conditions-03", "level": "קל", "title": "מתחלק ב-3", "statement": "קראו מספר שלם. הדפיסו <code>yes</code> אם הוא מתחלק ב-3 ללא שארית, אחרת <code>no</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "9\n", "output": "yes\n", "sample": true}, {"input": "10\n", "output": "no\n", "sample": false}, {"input": "0\n", "output": "yes\n", "sample": false}, {"input": "33\n", "output": "yes\n", "sample": false}], "hints": ["\"מתחלק ב-3 ללא שארית\" – זה רמז לאופרטור השארית.", "n % 3 נותן את השארית בחלוקה ב-3; אם היא 0, החלוקה מדויקת.", "כמעט התשובה: if (n % 3 == 0) Console.WriteLine(\"yes\"); else Console.WriteLine(\"no\");"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (n % 3 == 0)\n            Console.WriteLine(\"yes\");\n        else\n            Console.WriteLine(\"no\");\n    }\n}\n", "explanation": "`n % 3 == 0` – מתחלק ב-3 בלי שארית.\n`==` היא השוואה, ו-`=` היא השמה. אל תתבלבלו!"}, {"id": "conditions-04", "level": "קל", "title": "ערך מוחלט", "statement": "קראו מספר שלם והדפיסו את הערך המוחלט שלו <b>בלי Math.Abs</b> – רק עם if.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "-7\n", "output": "7\n", "sample": true}, {"input": "7\n", "output": "7\n", "sample": false}, {"input": "0\n", "output": "0\n", "sample": false}, {"input": "-1\n", "output": "1\n", "sample": false}], "hints": ["ערך מוחלט הוא המרחק מאפס – תמיד לא שלילי. מתי צריך לשנות את המספר?", "רק כשהמספר שלילי (n < 0) צריך לעשות משהו; מספר חיובי או 0 נשאר כמו שהוא, אז לא צריך else.", "כמעט התשובה: if (n < 0) n = -n; ואז Console.WriteLine(n); – מינוס של מספר שלילי הוא חיובי."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (n < 0)\n            n = -n;\n        Console.WriteLine(n);\n    }\n}\n", "explanation": "`if (n < 0) n = -n;` – אם המספר שלילי, הופכים לו את הסימן.\nאם הוא חיובי או 0, לא משנים כלום. אחרי ה-if מדפיסים."}, {"id": "conditions-05", "level": "קל", "title": "חיובי, שלילי או אפס", "statement": "קראו מספר שלם. הדפיסו <code>positive</code>, <code>negative</code> או <code>zero</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "5\n", "output": "positive\n", "sample": true}, {"input": "-2\n", "output": "negative\n", "sample": false}, {"input": "0\n", "output": "zero\n", "sample": false}, {"input": "-100\n", "output": "negative\n", "sample": false}], "hints": ["יש כאן שלוש אפשרויות ולא שתיים – if/else לבד לא מספיק.", "משתמשים בשרשרת if / else if / else: כל ענף נבדק רק אם הקודמים לא התקיימו.", "כמעט התשובה: if (n > 0) positive, else if (n < 0) negative, else zero – אם הוא לא חיובי ולא שלילי, הוא בהכרח 0."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (n > 0)\n            Console.WriteLine(\"positive\");\n        else if (n < 0)\n            Console.WriteLine(\"negative\");\n        else\n            Console.WriteLine(\"zero\");\n    }\n}\n", "explanation": "שלושה מקרים: `if (n > 0)`, אחריו `else if (n < 0)`, ובסוף `else`.\nל-else לא צריך תנאי: אם המספר לא חיובי ולא שלילי, הוא בטוח 0."}, {"id": "conditions-06", "level": "קל", "title": "הגדול מבין שניים", "statement": "קראו שני מספרים שלמים. הדפיסו את הגדול. אם הם שווים הדפיסו <code>equal</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "3\n8\n", "output": "8\n", "sample": true}, {"input": "8\n3\n", "output": "8\n", "sample": false}, {"input": "5\n5\n", "output": "equal\n", "sample": false}, {"input": "-4\n-9\n", "output": "-4\n", "sample": false}], "hints": ["שלושה מצבים אפשריים: a גדול, b גדול, או שהם שווים.", "כדאי לבדוק קודם שוויון עם == (שני סימני שווה – השוואה; סימן אחד = הוא השמה).", "כמעט התשובה: if (a == b) equal, else if (a > b) מדפיסים a, else מדפיסים b."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        if (a == b)\n            Console.WriteLine(\"equal\");\n        else if (a > b)\n            Console.WriteLine(a);\n        else\n            Console.WriteLine(b);\n    }\n}\n", "explanation": "קודם בודקים שוויון: `if (a == b)`.\n`else if (a > b)` – מדפיסים את a.\n`else` – נשאר רק המקרה ש-b גדול יותר."}, {"id": "conditions-07", "level": "קל", "title": "בטווח", "statement": "קראו מספר. הדפיסו <code>in</code> אם הוא בין 1 ל-10 (כולל), אחרת <code>out</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "1\n", "output": "in\n", "sample": true}, {"input": "10\n", "output": "in\n", "sample": false}, {"input": "0\n", "output": "out\n", "sample": false}, {"input": "11\n", "output": "out\n", "sample": false}, {"input": "5\n", "output": "in\n", "sample": false}], "hints": ["\"בין 1 ל-10\" זה בעצם שני תנאים: גדול מ-1 וגם קטן מ-10.", "כשצריך ששני תנאים יתקיימו יחד משתמשים ב-&& (\"וגם\").", "כמעט התשובה: if (n >= 1 && n <= 10) – עם >= ו-<= כי 1 ו-10 כלולים."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        if (n >= 1 && n <= 10)\n            Console.WriteLine(\"in\");\n        else\n            Console.WriteLine(\"out\");\n    }\n}\n", "explanation": "`n >= 1 && n <= 10` – שני תנאים מחוברים ב-&& (וגם). שניהם חייבים להתקיים.\nב-C# אי אפשר לכתוב `1 <= n <= 10`."}, {"id": "conditions-08", "level": "קל", "title": "ציון חוקי", "statement": "ציון מבחן חוקי הוא בין 30 ל-100 (כולל). קראו ציון והדפיסו <code>valid</code> או <code>invalid</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "30\n", "output": "valid\n", "sample": true}, {"input": "100\n", "output": "valid\n", "sample": false}, {"input": "29\n", "output": "invalid\n", "sample": false}, {"input": "101\n", "output": "invalid\n", "sample": false}, {"input": "75\n", "output": "valid\n", "sample": false}], "hints": ["לציון חוקי יש גבול תחתון וגבול עליון – שני תנאים.", "שני התנאים צריכים להתקיים יחד, ולכן מחברים אותם ב-&&.", "כמעט התשובה: if (g >= 30 && g <= 100) valid, else invalid – הגבולות 30 ו-100 כלולים."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int g = int.Parse(Console.ReadLine());\n        if (g >= 30 && g <= 100)\n            Console.WriteLine(\"valid\");\n        else\n            Console.WriteLine(\"invalid\");\n    }\n}\n", "explanation": "בדיקת טווח (range check): `g >= 30 && g <= 100`.\nהמילה \"כולל\" אומרת שצריך `>=` ו-`<=`."}, {"id": "conditions-09", "level": "קל", "title": "נער/ה", "statement": "קראו גיל. אם בין 13 ל-19 (כולל) הדפיסו <code>teen</code>, אחרת <code>not teen</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "13\n", "output": "teen\n", "sample": true}, {"input": "19\n", "output": "teen\n", "sample": false}, {"input": "12\n", "output": "not teen\n", "sample": false}, {"input": "20\n", "output": "not teen\n", "sample": false}], "hints": ["teen זה טווח גילים – בדיוק כמו \"בין X ל-Y\".", "טווח בודקים עם שני תנאים מחוברים ב-&&, ושימו לב שגם 13 וגם 19 כלולים.", "כמעט התשובה: if (age >= 13 && age <= 19) teen, אחרת not teen."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        if (age >= 13 && age <= 19)\n            Console.WriteLine(\"teen\");\n        else\n            Console.WriteLine(\"not teen\");\n    }\n}\n", "explanation": "`age >= 13 && age <= 19` – נמצא בטווח הגילאים.\nכל השאר נופלים ל-else."}, {"id": "conditions-10", "level": "קל", "title": "הנחה", "statement": "קראו גיל. ילדים מתחת ל-18 או מבוגרים מגיל 65 מקבלים הנחה: הדפיסו <code>discount</code>, אחרת <code>full</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "10\n", "output": "discount\n", "sample": true}, {"input": "17\n", "output": "discount\n", "sample": false}, {"input": "18\n", "output": "full\n", "sample": false}, {"input": "64\n", "output": "full\n", "sample": false}, {"input": "65\n", "output": "discount\n", "sample": false}], "hints": ["יש שתי קבוצות שמקבלות הנחה – מספיק להיות באחת מהן.", "כשמספיק שאחד התנאים יתקיים משתמשים ב-|| (\"או\").", "כמעט התשובה: if (age < 18 || age >= 65) discount, else full – 18 כבר לא ילד, ו-65 כבר כן מבוגר."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        if (age < 18 || age >= 65)\n            Console.WriteLine(\"discount\");\n        else\n            Console.WriteLine(\"full\");\n    }\n}\n", "explanation": "`age < 18 || age >= 65` – מספיק שאחד מהתנאים נכון (|| = או).\n18 עד 64 משלמים מחיר מלא."}, {"id": "conditions-11", "level": "בינוני", "title": "משלוח חינם", "statement": "קראו סכום קנייה (double). אם הוא 200 ומעלה – המשלוח חינם; אחרת מוסיפים 30 ₪. הדפיסו את הסכום הסופי.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "250\n", "output": "250\n", "sample": true}, {"input": "199.5\n", "output": "229.5\n", "sample": false}, {"input": "200\n", "output": "200\n", "sample": false}, {"input": "10\n", "output": "40\n", "sample": false}], "hints": ["הסכום יכול להיות עשרוני (199.5) – איזה טיפוס מתאים?", "מוסיפים 30 רק כשהקנייה קטנה מ-200; אפשר לשנות את המשתנה בתוך ה-if ולהדפיס אחרי, בלי else.", "כמעט התשובה: if (total < 200) total = total + 30; ואז Console.WriteLine(total);"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        double total = double.Parse(Console.ReadLine());\n        if (total < 200)\n            total = total + 30;\n        Console.WriteLine(total);\n    }\n}\n", "explanation": "מוסיפים את דמי המשלוח רק כשהסכום קטן מ-200: `if (total < 200) total = total + 30;`.\nמדפיסים אחרי ה-if, ולכן ההדפסה מתבצעת בשני המקרים."}, {"id": "conditions-12", "level": "בינוני", "title": "מיון שניים", "statement": "קראו שני מספרים והדפיסו אותם בסדר עולה באותה שורה עם רווח. (9, 4 → <code>4 9</code>)", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "9\n4\n", "output": "4 9\n", "sample": true}, {"input": "1\n2\n", "output": "1 2\n", "sample": false}, {"input": "3\n3\n", "output": "3 3\n", "sample": false}, {"input": "-5\n0\n", "output": "-5 0\n", "sample": false}], "hints": ["צריך לדעת מי מהשניים קטן יותר, כדי להדפיס אותו ראשון.", "if אחד מספיק: אם a <= b הסדר כבר נכון, אחרת מחליפים בהדפסה.", "כמעט התשובה: if (a <= b) Console.WriteLine(a + \" \" + b); else Console.WriteLine(b + \" \" + a);"], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        if (a <= b)\n            Console.WriteLine(a + \" \" + b);\n        else\n            Console.WriteLine(b + \" \" + a);\n    }\n}\n", "explanation": "`if (a <= b)` – אם a קטן או שווה ל-b, הוא מודפס ראשון.\n`a + \" \" + b` – רווח בין המספרים.\nאחרת מדפיסים את b ראשון."}, {"id": "conditions-13", "level": "בינוני", "title": "מזג אוויר", "statement": "קראו טמפרטורה (int). מתחת ל-15: <code>cold</code>; מ-15 עד 24: <code>nice</code>; 25 ומעלה: <code>hot</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "10\n", "output": "cold\n", "sample": true}, {"input": "15\n", "output": "nice\n", "sample": false}, {"input": "24\n", "output": "nice\n", "sample": false}, {"input": "25\n", "output": "hot\n", "sample": false}, {"input": "40\n", "output": "hot\n", "sample": false}], "hints": ["שלושה טווחים → שלושה ענפים: if / else if / else.", "מתחילים מהטווח הנמוך: if (t < 15) cold. ב-else if כבר ידוע ש-t >= 15, אז לא צריך לבדוק את זה שוב.", "כמעט התשובה: if (t < 15) cold, else if (t < 25) nice, else hot."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int t = int.Parse(Console.ReadLine());\n        if (t < 15)\n            Console.WriteLine(\"cold\");\n        else if (t < 25)\n            Console.WriteLine(\"nice\");\n        else\n            Console.WriteLine(\"hot\");\n    }\n}\n", "explanation": "`if (t < 15)` → cold.\n`else if (t < 25)` – כאן כבר ידוע ש-t ≥ 15, אז לא צריך לבדוק את זה שוב.\n`else` → hot."}, {"id": "conditions-14", "level": "בינוני", "title": "הגדול מבין שלושה", "statement": "קראו 3 מספרים שלמים והדפיסו את הגדול ביותר – <b>בלי Math.Max</b>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "1\n2\n3\n", "output": "3\n", "sample": true}, {"input": "3\n2\n1\n", "output": "3\n", "sample": false}, {"input": "2\n3\n1\n", "output": "3\n", "sample": false}, {"input": "7\n7\n2\n", "output": "7\n", "sample": false}], "hints": ["אסור Math.Max – אז נמצא את הגדול בעצמנו, צעד אחרי צעד.", "מניחים ש-a הכי גדול: int max = a; – ואז כל מספר אחר רק צריך \"לנצח\" אותו.", "כמעט התשובה: if (b > max) max = b; if (c > max) max = c; ובסוף מדפיסים את max."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        int c = int.Parse(Console.ReadLine());\n        int max = a;\n        if (b > max) max = b;\n        if (c > max) max = c;\n        Console.WriteLine(max);\n    }\n}\n", "explanation": "`int max = a;` – מניחים ש-a הכי גדול.\n`if (b > max) max = b;` ואחר כך אותו דבר עם c: מעדכנים כשמוצאים מספר גדול יותר.\nבסוף max הוא הגדול מבין השלושה."}, {"id": "conditions-15", "level": "בינוני", "title": "ציון באותיות", "statement": "קראו ציון 0–100. 90+ → <code>A</code>, 80+ → <code>B</code>, 70+ → <code>C</code>, 60+ → <code>D</code>, אחרת <code>F</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "95\n", "output": "A\n", "sample": true}, {"input": "85\n", "output": "B\n", "sample": false}, {"input": "70\n", "output": "C\n", "sample": false}, {"input": "65\n", "output": "D\n", "sample": false}, {"input": "59\n", "output": "F\n", "sample": false}], "hints": ["יש חמש אפשרויות – שרשרת ארוכה של else if.", "מתחילים מהציון הגבוה: if (g >= 90) A. כך ציון 95 לא \"נתפס\" בטעות בתנאי של B.", "כמעט התשובה: >= 90 → A, else if >= 80 → B, else if >= 70 → C, else if >= 60 → D, else F."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int g = int.Parse(Console.ReadLine());\n        if (g >= 90) Console.WriteLine(\"A\");\n        else if (g >= 80) Console.WriteLine(\"B\");\n        else if (g >= 70) Console.WriteLine(\"C\");\n        else if (g >= 60) Console.WriteLine(\"D\");\n        else Console.WriteLine(\"F\");\n    }\n}\n", "explanation": "שרשרת `else if` מהציון הגבוה לנמוך.\nכל ענף נבדק רק אם כל התנאים שלפניו נכשלו, ולכן `g >= 80` כבר אומר בפועל 80 עד 89."}, {"id": "conditions-16", "level": "בינוני", "title": "כניסה למערכת", "statement": "קראו שם משתמש וסיסמה. אם השם <code>admin</code> <b>וגם</b> הסיסמה <code>1234</code> הדפיסו <code>welcome</code>, אחרת <code>denied</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "admin\n1234\n", "output": "welcome\n", "sample": true}, {"input": "admin\n0000\n", "output": "denied\n", "sample": false}, {"input": "user\n1234\n", "output": "denied\n", "sample": false}], "hints": ["שם המשתמש והסיסמה הם טקסט – לא צריך Parse.", "מחרוזות אפשר להשוות עם ==, ושני התנאים חייבים להתקיים יחד – &&.", "כמעט התשובה: if (user == \"admin\" && pass == \"1234\") welcome, else denied."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        string user = Console.ReadLine();\n        string pass = Console.ReadLine();\n        if (user == \"admin\" && pass == \"1234\")\n            Console.WriteLine(\"welcome\");\n        else\n            Console.WriteLine(\"denied\");\n    }\n}\n", "explanation": "גם שם המשתמש וגם הסיסמה הם string, ולכן אין צורך ב-Parse.\n`user == \"admin\" && pass == \"1234\"` – שני התנאים חייבים להתקיים."}, {"id": "conditions-17", "level": "בינוני", "title": "סוף שבוע", "statement": "קראו מספר יום 1–7. ימים 6 או 7 → <code>weekend</code>; 1–5 → <code>weekday</code>; כל מספר אחר → <code>error</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "6\n", "output": "weekend\n", "sample": true}, {"input": "1\n", "output": "weekday\n", "sample": false}, {"input": "5\n", "output": "weekday\n", "sample": false}, {"input": "0\n", "output": "error\n", "sample": false}, {"input": "8\n", "output": "error\n", "sample": false}], "hints": ["יש שלוש תוצאות: weekend, weekday ו-error – שרשרת if / else if / else.", "סוף שבוע הוא יום 6 או יום 7 → ||. ימי חול הם טווח 1–5 → &&.", "כמעט התשובה: if (d == 6 || d == 7) weekend, else if (d >= 1 && d <= 5) weekday, else error."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int d = int.Parse(Console.ReadLine());\n        if (d == 6 || d == 7)\n            Console.WriteLine(\"weekend\");\n        else if (d >= 1 && d <= 5)\n            Console.WriteLine(\"weekday\");\n        else\n            Console.WriteLine(\"error\");\n    }\n}\n", "explanation": "`d == 6 || d == 7` – סוף שבוע.\n`d >= 1 && d <= 5` – יום חול.\n`else` – כל מספר אחר הוא שגיאה."}, {"id": "conditions-18", "level": "בינוני", "title": "משולש קיים?", "statement": "קראו 3 אורכי צלעות. משולש אפשרי רק אם סכום כל שתי צלעות גדול מהשלישית. הדפיסו <code>valid</code> או <code>invalid</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "3\n4\n5\n", "output": "valid\n", "sample": true}, {"input": "1\n2\n3\n", "output": "invalid\n", "sample": false}, {"input": "10\n1\n1\n", "output": "invalid\n", "sample": false}, {"input": "5\n5\n5\n", "output": "valid\n", "sample": false}], "hints": ["צריך לבדוק את הכלל לכל זוג צלעות – כמה זוגות יש בין 3 צלעות?", "יש 3 זוגות: a+b מול c, a+c מול b, b+c מול a – וכולם חייבים להתקיים, לכן &&.", "כמעט התשובה: if (a + b > c && a + c > b && b + c > a) valid, else invalid – שימו לב ל-> ולא >=, כי 1+2=3 לא יוצר משולש."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        int c = int.Parse(Console.ReadLine());\n        if (a + b > c && a + c > b && b + c > a)\n            Console.WriteLine(\"valid\");\n        else\n            Console.WriteLine(\"invalid\");\n    }\n}\n", "explanation": "משולש קיים רק אם סכום כל שתי צלעות גדול מהצלע השלישית.\nשלושה תנאים מחוברים ב-&&: `a + b > c && a + c > b && b + c > a`."}, {"id": "conditions-19", "level": "בינוני", "title": "סוג משולש", "statement": "קראו 3 צלעות (משולש תקין). כל הצלעות שוות → <code>equilateral</code>; בדיוק שתיים שוות → <code>isosceles</code>; אחרת <code>scalene</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "5\n5\n5\n", "output": "equilateral\n", "sample": true}, {"input": "5\n5\n3\n", "output": "isosceles\n", "sample": false}, {"input": "3\n5\n5\n", "output": "isosceles\n", "sample": false}, {"input": "5\n3\n5\n", "output": "isosceles\n", "sample": false}, {"input": "3\n4\n5\n", "output": "scalene\n", "sample": false}], "hints": ["שלוש תוצאות, והסדר שבו בודקים חשוב.", "בודקים קודם \"כולן שוות\" (a == b && b == c), כי משולש שווה צלעות גם עונה על \"שתיים שוות\".", "כמעט התשובה: אחר כך else if (a == b || b == c || a == c) isosceles – כל זוג יכול להיות השווה – ואחרת scalene."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int a = int.Parse(Console.ReadLine());\n        int b = int.Parse(Console.ReadLine());\n        int c = int.Parse(Console.ReadLine());\n        if (a == b && b == c)\n            Console.WriteLine(\"equilateral\");\n        else if (a == b || b == c || a == c)\n            Console.WriteLine(\"isosceles\");\n        else\n            Console.WriteLine(\"scalene\");\n    }\n}\n", "explanation": "הכי מחמיר קודם: `a == b && b == c` (כל הצלעות שוות).\nאחר כך `a == b || b == c || a == c` – לפחות שתי צלעות שוות.\n`else` – כל הצלעות שונות."}, {"id": "conditions-20", "level": "בינוני", "title": "מועד ב׳", "statement": "(מתוך המבחן) קראו ציון שנתי (int) ואחוז נוכחות (double).<br>55 ומעלה → <code>עבר</code><br>בין 45 ל-55 (לא כולל 55) <b>וגם</b> נוכחות 80% לפחות → <code>זכאי למועד ב'</code><br>אחרת → <code>נכשל</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "55\n50\n", "output": "עבר\n", "sample": true}, {"input": "50\n80\n", "output": "זכאי למועד ב'\n", "sample": false}, {"input": "50\n79.9\n", "output": "נכשל\n", "sample": false}, {"input": "45\n100\n", "output": "זכאי למועד ב'\n", "sample": false}, {"input": "44\n100\n", "output": "נכשל\n", "sample": false}], "hints": ["יש שני קלטים: ציון (int) ונוכחות (double, כי יכולה להיות 79.9).", "מתחילים מהמקרה הפשוט: if (grade >= 55) עבר. ב-else if כבר ידוע שהציון מתחת ל-55, אז בודקים רק grade >= 45.", "כמעט התשובה: else if (grade >= 45 && attendance >= 80) \"זכאי למועד ב'\", else נכשל. הגרש ' מותר בתוך \"...\"."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int grade = int.Parse(Console.ReadLine());\n        double attendance = double.Parse(Console.ReadLine());\n        if (grade >= 55)\n            Console.WriteLine(\"עבר\");\n        else if (grade >= 45 && attendance >= 80)\n            Console.WriteLine(\"זכאי למועד ב'\");\n        else\n            Console.WriteLine(\"נכשל\");\n    }\n}\n", "explanation": "`if (grade >= 55)` → עבר.\n`else if (grade >= 45 && attendance >= 80)` – כאן כבר ידוע שהציון מתחת ל-55, אז זה בדיוק הטווח 45 עד 54.\n`else` → נכשל."}, {"id": "conditions-21", "level": "מבחן", "title": "מחיר לפי גיל", "statement": "(מתוך המבחן – לונה-לנד) קראו גיל. הדפיסו את מחיר הכניסה:<br>מתחת ל-3: <code>0</code> ; 3–12: <code>89</code> ; 13–64: <code>129</code> ; 65 ומעלה: <code>65</code>", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "2\n", "output": "0\n", "sample": true}, {"input": "3\n", "output": "89\n", "sample": false}, {"input": "12\n", "output": "89\n", "sample": false}, {"input": "13\n", "output": "129\n", "sample": false}, {"input": "65\n", "output": "65\n", "sample": false}], "hints": ["ארבעה טווחי גילים → שרשרת if / else if עם ארבעה ענפים.", "שימו לב לגבולות: 3 ו-12 שייכים ל-89, ו-64 שייך ל-129. כשעוברים מהקטן לגדול מספיק לבדוק רק את הגבול העליון.", "כמעט התשובה: if (age < 3) 0, else if (age <= 12) 89, else if (age <= 64) 129, else 65 – אפשר לשמור במשתנה int price ולהדפיס בסוף."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        int price;\n        if (age < 3)\n            price = 0;\n        else if (age <= 12)\n            price = 89;\n        else if (age <= 64)\n            price = 129;\n        else\n            price = 65;\n        Console.WriteLine(price);\n    }\n}\n", "explanation": "`int price;` – מגדירים משתנה, וכל ענף נותן לו ערך.\nגבולות: `age < 3` → 0, `age <= 12` → 89, `age <= 64` → 129, אחרת 65.\nמדפיסים פעם אחת בסוף."}, {"id": "conditions-22", "level": "מבחן", "title": "שנה מעוברת", "statement": "קראו שנה. שנה מעוברת (leap year) אם היא מתחלקת ב-4 <b>אבל לא</b> ב-100, <b>או</b> שהיא מתחלקת ב-400. הדפיסו <code>leap</code> או <code>not leap</code>.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "2024\n", "output": "leap\n", "sample": true}, {"input": "2023\n", "output": "not leap\n", "sample": false}, {"input": "1900\n", "output": "not leap\n", "sample": false}, {"input": "2000\n", "output": "leap\n", "sample": false}, {"input": "2100\n", "output": "not leap\n", "sample": false}], "hints": ["יש כאן שילוב של \"וגם\", \"אבל לא\" ו\"או\" – כדאי לפרק לחלקים.", "\"מתחלקת ב-4\" זה y % 4 == 0, ו\"לא מתחלקת ב-100\" זה y % 100 != 0. שניהם יחד → &&.", "כמעט התשובה: if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) – הסוגריים מקבצים את החלק הראשון לפני ה-||."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int y = int.Parse(Console.ReadLine());\n        if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0)\n            Console.WriteLine(\"leap\");\n        else\n            Console.WriteLine(\"not leap\");\n    }\n}\n", "explanation": "`(y % 4 == 0 && y % 100 != 0)` – מתחלקת ב-4 אבל לא ב-100.\n`|| y % 400 == 0` – או שמתחלקת ב-400.\nהסוגריים מקבצים את החלק הראשון."}, {"id": "conditions-23", "level": "מבחן", "title": "מחשבון ציון שנתי", "statement": "(מתוך המבחן, שאלה 2.1) קראו ציון מבחן (int, 30–100), ציון עבודה (int) ואחוז נוכחות (double).<br>ציון שנתי = 70% מבחן + 30% עבודה.<br>נוכחות מתחת ל-80% → יורדות 5 נקודות.<br>נוכחות 95% ומעלה → מתווספות 3 נקודות, אבל הציון לא יעלה על 100.<br>הדפיסו את הציון השנתי.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "80\n90\n85\n", "output": "83\n", "sample": true}, {"input": "100\n100\n99\n", "output": "100\n", "sample": false}, {"input": "90\n80\n96\n", "output": "90\n", "sample": false}, {"input": "60\n50\n70\n", "output": "52\n", "sample": false}, {"input": "30\n30\n80\n", "output": "30\n", "sample": false}], "hints": ["קודם מחשבים את הציון הבסיסי, ורק אחר כך מטפלים בנוכחות.", "70% זה כפול 0.7: double grade = 0.7 * exam + 0.3 * work; – כתבו בסדר הזה כדי לקבל בדיוק אותה תוצאה עשרונית.", "כמעט התשובה: if (attendance < 80) grade = grade - 5; else if (attendance >= 95) grade = Math.Min(100, grade + 3); – Math.Min מונע עלייה מעל 100."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int exam = int.Parse(Console.ReadLine());\n        int work = int.Parse(Console.ReadLine());\n        double attendance = double.Parse(Console.ReadLine());\n        double grade = 0.7 * exam + 0.3 * work;\n        if (attendance < 80)\n            grade = grade - 5;\n        else if (attendance >= 95)\n            grade = Math.Min(100, grade + 3);\n        Console.WriteLine(grade);\n    }\n}\n", "explanation": "`double grade = 0.7 * exam + 0.3 * work;` – 70% מבחן ועוד 30% עבודה.\n`if (attendance < 80) grade = grade - 5;` – קנס על נוכחות נמוכה.\n`else if (attendance >= 95) grade = Math.Min(100, grade + 3);` – בונוס, אבל `Math.Min` לא נותן לציון לעלות מעל 100."}, {"id": "conditions-24", "level": "מבחן", "title": "מחיר כרטיס + VIP", "statement": "(מתוך המבחן) קראו גיל (int) והאם הכרטיס VIP (bool). מחיר לפי גיל: מתחת ל-3 חינם (0), 3–12: 89, 13–64: 129, 65+: 65. כרטיס VIP משלם <b>50% נוספים</b> על המחיר. הדפיסו את המחיר.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        \n    }\n}\n", "tests": [{"input": "2\ntrue\n", "output": "0\n", "sample": true}, {"input": "10\ntrue\n", "output": "133.5\n", "sample": false}, {"input": "30\ntrue\n", "output": "193.5\n", "sample": false}, {"input": "70\ntrue\n", "output": "97.5\n", "sample": false}, {"input": "13\nfalse\n", "output": "129\n", "sample": false}], "hints": ["מפרקים לשני שלבים: מחיר לפי גיל, ואז תוספת VIP.", "מחיר הבסיס כמו בתרגיל הקודם (שרשרת else if). price צריך להיות double, כי 89 * 1.5 = 133.5.", "כמעט התשובה: אחרי השרשרת if (vip) price = price * 1.5; – 50% נוספים זה כפול 1.5."], "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int age = int.Parse(Console.ReadLine());\n        bool vip = bool.Parse(Console.ReadLine());\n        double price;\n        if (age < 3) price = 0;\n        else if (age <= 12) price = 89;\n        else if (age <= 64) price = 129;\n        else price = 65;\n        if (vip)\n            price = price * 1.5;\n        Console.WriteLine(price);\n    }\n}\n", "explanation": "קודם מחיר בסיס לפי גיל (שרשרת else if).\n`if (vip) price = price * 1.5;` – תוספת של 50% היא כפל ב-1.5.\n`price` הוא double כי 89 * 1.5 = 133.5."}]}, {"id": "for-loops", "title": "לולאת for", "order": 4, "intro": "לולאת for חוזרת על קוד מספר פעמים ידוע מראש. יש לה שלושה חלקים: התחלה (int i = 1), תנאי המשך (i <= n) וקידום (i++).\n\nדוגמה – הדפסת המספרים 1 עד 5:\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine(i);\n}", "exercises": [{"id": "for-01", "level": "קל", "title": "ספירה עד N", "statement": "קלוט מספר שלם חיובי N והדפס את כל המספרים מ-1 עד N, כל מספר בשורה נפרדת.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n", "output": "1\n2\n3\n4\n5\n", "sample": true}, {"input": "1\n", "output": "1\n", "sample": false}, {"input": "8\n", "output": "1\n2\n3\n4\n5\n6\n7\n8\n", "sample": false}], "hints": ["כמה פעמים צריך לחזור? בדיוק N פעמים – לכן זו לולאת for, כי מספר החזרות ידוע מראש.", "המשתנה i יכול להיות גם המספר שמדפיסים, כי הוא עובר בדיוק על 1, 2, 3...", "for (int i = 1; i <= n; i++) ובתוכה Console.WriteLine(i); – משתמשים ב-<= כדי ש-N עצמו יודפס."], "explanation": "קולטים את N וממירים למספר עם int.Parse. לולאת for מתחילה ב-1 ורצה כל עוד i <= n, ובכל סיבוב מדפיסה את i.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        for (int i = 1; i <= n; i++)\n        {\n            Console.WriteLine(i);\n        }\n    }\n}\n"}, {"id": "for-02", "level": "קל", "title": "סכום 1 עד N", "statement": "קלוט מספר שלם חיובי N והדפס את סכום המספרים מ-1 עד N.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "5\n", "output": "15\n", "sample": true}, {"input": "1\n", "output": "1\n", "sample": false}, {"input": "100\n", "output": "5050\n", "sample": false}, {"input": "10\n", "output": "55\n", "sample": false}], "hints": ["צריך 'לזכור' סכום שגדל – לכן צריך משתנה שמחוץ ללולאה.", "המשתנה sum מתחיל ב-0, כי לפני שחיברנו משהו הסכום הוא אפס.", "בכל סיבוב: sum += i; ורק אחרי הלולאה מדפיסים, כדי להדפיס פעם אחת את התוצאה הסופית."], "explanation": "יוצרים sum = 0 לפני הלולאה. הלולאה עוברת על 1 עד N ומוסיפה כל i לסכום. בסוף מדפיסים את sum פעם אחת.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        for (int i = 1; i <= n; i++)\n        {\n            sum += i;\n        }\n        Console.WriteLine(sum);\n    }\n}\n"}, {"id": "for-03", "level": "קל", "title": "לוח הכפל", "statement": "קלוט מספר שלם N והדפס את לוח הכפל שלו מ-1 עד 10, בפורמט: N x i = תוצאה (למשל 3 x 2 = 6).", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n", "output": "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30\n", "sample": true}, {"input": "7\n", "output": "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70\n", "sample": false}, {"input": "1\n", "output": "1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n1 x 10 = 10\n", "sample": false}], "hints": ["תמיד יש 10 שורות – אז הלולאה רצה מ-1 עד 10, לא עד N.", "N לא משתנה; רק i משתנה בכל שורה.", "Console.WriteLine(n + \" x \" + i + \" = \" + (n * i)); – הסוגריים סביב n * i חשובים, אחרת C# ישרשר טקסט במקום לחשב."], "explanation": "קולטים את N ורצים עם i מ-1 עד 10. בכל סיבוב בונים מחרוזת משרשור של n, i והמכפלה, ומדפיסים אותה.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        for (int i = 1; i <= 10; i++)\n        {\n            Console.WriteLine(n + \" x \" + i + \" = \" + (n * i));\n        }\n    }\n}\n"}, {"id": "for-04", "level": "קל", "title": "מספרים זוגיים", "statement": "קלוט מספר שלם חיובי N והדפס את כל המספרים הזוגיים מ-2 עד N (כולל), כל אחד בשורה.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "10\n", "output": "2\n4\n6\n8\n10\n", "sample": true}, {"input": "7\n", "output": "2\n4\n6\n", "sample": false}, {"input": "2\n", "output": "2\n", "sample": false}], "hints": ["אפשר לעבור על כל המספרים ולבדוק זוגיות, אבל יש דרך קצרה יותר.", "מספרים זוגיים מתקדמים בקפיצות של 2 – אז אפשר לקדם את i ב-2 במקום ב-1.", "for (int i = 2; i <= n; i += 2) – מתחילים ב-2 כי זה הזוגי הראשון."], "explanation": "הלולאה מתחילה ב-2 ומתקדמת ב-2 בכל פעם, כך שהיא עוברת רק על מספרים זוגיים. התנאי i <= n מבטיח שגם N יודפס אם הוא זוגי.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        for (int i = 2; i <= n; i += 2)\n        {\n            Console.WriteLine(i);\n        }\n    }\n}\n"}, {"id": "for-05", "level": "בינוני", "title": "סכום N מספרים", "statement": "קלוט מספר שלם N, ואחריו N מספרים שלמים (כל אחד בשורה). הדפס את סכומם.", "starter": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        // כתבו כאן את הקוד שלכם\n    }\n}\n", "tests": [{"input": "3\n4\n5\n6\n", "output": "15\n", "sample": true}, {"input": "1\n-7\n", "output": "-7\n", "sample": false}, {"input": "5\n1\n2\n3\n4\n5\n", "output": "15\n", "sample": false}, {"input": "4\n10\n-10\n3\n0\n", "output": "3\n", "sample": false}], "hints": ["הקלט הראשון שונה מהשאר: הוא אומר כמה מספרים יגיעו. לכן קולטים אותו לפני הלולאה.", "את שאר המספרים קולטים בתוך הלולאה, כי כל סיבוב 'אוכל' שורת קלט אחת.", "בתוך הלולאה: int x = int.Parse(Console.ReadLine()); sum += x;"], "explanation": "קולטים את N, ואז לולאה שרצה N פעמים קולטת בכל סיבוב מספר ומוסיפה אותו ל-sum. אחרי הלולאה מדפיסים את הסכום.", "solution": "using System;\n\nclass Program\n{\n    static void Main()\n    {\n        int n = int.Parse(Console.ReadLine());\n        int sum = 0;\n        for (int i = 0; i < n; i++)\n        {\n            int x = int.Parse(Console.ReadLine());\n            sum += x;\n        }\n        Console.WriteLine(sum);\n    }\n}\n"}, {"id": "for-06", "level": "בינוני", "title": "ממוצע", "statement": "קלוט מספר שלם N (גדול מ-0), ואחריו N מספרים שלמים. הדפס את הממוצע שלהם מעוגל ל-2 ספרות אחרי הנקודה בעזרת Math.Round
